<style>
/* Layout: control-room HUD — glass command bar, icon rail, split panes on a blueprint grid. Dark-first, light theme mirrored. */
:root{
  --bg:#050a13; --grid:rgba(56,140,220,.07); --halo1:rgba(34,211,238,.13); --halo2:rgba(167,139,250,.10);
  --panel:#0b1626; --panel-solid:#0b1626; --panel2:#102036; --line:#1d3554; --line-hi:#2f5a8f;
  --fg:#f1f6fd; --muted:#a3b6cf; --accent:#22d3ee; --accent2:#a78bfa; --accent-ink:#03121b;
  --accent-soft:rgba(34,211,238,.12); --sel:rgba(34,211,238,.09); --hi:rgba(255,255,255,.05);
  --glow:0 0 0 1px rgba(34,211,238,.4),0 0 22px rgba(34,211,238,.22); --shadow:0 10px 30px rgba(0,0,0,.35);
  --ok:#34d399; --warn:#fbbf24; --err:#fb7185; --info:#818cf8; --scrim:rgba(2,6,12,.7);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#edf2f9; --grid:rgba(30,90,170,.06); --halo1:rgba(2,132,199,.10); --halo2:rgba(124,58,237,.08);
  --panel:#ffffff; --panel-solid:#ffffff; --panel2:#f1f5fb; --line:#d0dbea; --line-hi:#9fb6d3;
  --fg:#071226; --muted:#41536d; --accent:#0284c7; --accent2:#7c3aed; --accent-ink:#ffffff;
  --accent-soft:rgba(2,132,199,.10); --sel:rgba(2,132,199,.08); --hi:rgba(255,255,255,.9);
  --glow:0 0 0 1px rgba(2,132,199,.35),0 6px 18px rgba(2,132,199,.16); --shadow:0 8px 24px rgba(20,50,90,.10);
  --ok:#059669; --warn:#b45309; --err:#e11d48; --info:#4f46e5; --scrim:rgba(15,30,55,.45); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#edf2f9; --grid:rgba(30,90,170,.06); --halo1:rgba(2,132,199,.10); --halo2:rgba(124,58,237,.08);
  --panel:#ffffff; --panel-solid:#ffffff; --panel2:#f1f5fb; --line:#d0dbea; --line-hi:#9fb6d3;
  --fg:#071226; --muted:#41536d; --accent:#0284c7; --accent2:#7c3aed; --accent-ink:#ffffff;
  --accent-soft:rgba(2,132,199,.10); --sel:rgba(2,132,199,.08); --hi:rgba(255,255,255,.9);
  --glow:0 0 0 1px rgba(2,132,199,.35),0 6px 18px rgba(2,132,199,.16); --shadow:0 8px 24px rgba(20,50,90,.10);
  --ok:#059669; --warn:#b45309; --err:#e11d48; --info:#4f46e5; --scrim:rgba(15,30,55,.45); color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%}
body{color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal;
  background:var(--bg);
  background-image:radial-gradient(900px 500px at 85% -10%,var(--halo1),transparent 60%),radial-gradient(700px 500px at -10% 110%,var(--halo2),transparent 60%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,28px 28px,28px 28px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:216px 1fr}
/* top bar */
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent2) 70%,transparent);opacity:.7}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 6px var(--accent-soft))}
.logo .ring{fill:none;stroke:var(--accent);stroke-width:1.6;transform-origin:16px 16px;animation:spin 18s linear infinite}
.logo .core{fill:none;stroke:var(--accent2);stroke-width:1.6}
.logo .n{fill:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05;background:linear-gradient(90deg,var(--fg),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fileinfo{display:flex;align-items:center;gap:8px;min-width:0;flex:1;flex-wrap:wrap}
.fname{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.chip.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,transparent)}.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}.chip.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent)}.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.dirty{font-family:var(--f-mono);font-size:10.5px;color:var(--warn);letter-spacing:.08em;text-transform:uppercase}
.status{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-family:var(--f-mono);font-size:11.5px}
.status:hover{box-shadow:var(--glow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}.dot.err{background:var(--err);box-shadow:0 0 10px var(--err);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:box-shadow .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--accent);box-shadow:var(--glow)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--err)}.btn.danger:hover{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.icon{padding:6px 9px;line-height:0}
.btn:disabled{opacity:.4;cursor:default}
.btn svg,.nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto;padding-left:max(10px,env(safe-area-inset-left,0px))}
.rail .cap{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.nav{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;font-weight:500;width:100%;color:var(--muted);transition:color .15s,background .15s}
.nav span{flex:1;color:var(--fg)}
.nav:hover{background:var(--panel2);color:var(--accent)}
.nav.on{background:linear-gradient(90deg,var(--accent-soft),transparent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent)}
.nav.on span{color:var(--accent);font-weight:600}
.nav.on:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.nav small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.rail .sep{height:1px;background:var(--line);margin:10px 4px}
.rail .hint{font-size:11.5px;color:var(--muted);padding:4px 10px;line-height:1.5}
/* main */
main{overflow:auto;padding-block:20px 48px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));min-width:0}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:27px;font-weight:700}h2{font-size:17px;text-transform:uppercase;letter-spacing:.06em}h3{font-size:14.5px;letter-spacing:.03em}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.vh p{margin:4px 0 0;color:var(--muted);max-width:72ch;line-height:1.5}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.eyebrow:before{content:"";width:14px;height:1px;background:var(--accent)}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.card:before,.pane:before{content:"";position:absolute;top:-1px;left:16px;width:40px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));pointer-events:none}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:10px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:hidden;box-shadow:inset 0 1px 0 var(--hi)}
.tile:after{content:"";position:absolute;right:-20px;top:-20px;width:60px;height:60px;border-radius:50%;background:radial-gradient(var(--accent-soft),transparent 70%)}
.tile b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tile span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--f-mono);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line-hi);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sel)}
tr.on td{background:var(--accent-soft)}
.mono{font-family:var(--f-mono);font-size:12.5px;font-feature-settings:'zero' 0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.split{display:grid;grid-template-columns:minmax(240px,330px) minmax(0,1fr);gap:16px;align-items:start}
.split3{display:grid;grid-template-columns:minmax(170px,220px) minmax(250px,320px) minmax(0,1fr);gap:16px;align-items:start}
.pane{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;max-height:calc(100vh - 190px);overflow:auto;box-shadow:var(--shadow)}
.pane>.ph{position:sticky;top:0;background:var(--panel-solid);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;z-index:1}
.pane>.pb{padding:12px}
.list{display:flex;flex-direction:column;padding:4px 0}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;margin:1px 6px;cursor:pointer;border-radius:7px;border:1px solid transparent;transition:background .12s}
.li:hover{background:var(--sel)}
.li.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.li .t{font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.dim{opacity:.5}
.grp{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);padding:12px 14px 4px}
input.f,select.f,textarea.f{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent);box-shadow:var(--glow);outline:none}
input.cell{background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 6px;font-family:var(--f-mono);font-size:12.5px;font-weight:500;width:100%;min-width:90px}
input.cell:hover{border-color:var(--line)}input.cell:focus{border-color:var(--accent);background:var(--panel2);box-shadow:var(--glow);outline:none}
select.cell{background:var(--panel2);border:1px solid var(--line);border-radius:5px;font-family:var(--f-mono);font-size:12px;padding:2px 4px}
.bad input.cell,.bad{color:var(--err)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;font-size:13px}
.kv dt{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}.kv dd{margin:0;font-family:var(--f-mono);font-size:12px;word-break:break-all}
/* tree */
.tree{font-family:var(--f-mono);font-size:12px;padding:6px 0}
.tn{display:flex;align-items:center;gap:4px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.tn:hover{background:var(--sel)}
.tn.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.tw{width:14px;color:var(--muted);text-align:center;flex:none}
.tg{color:var(--accent)}.ta{color:var(--muted)}
/* data model */
details.do{border-bottom:1px solid var(--line)}
details.do>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:8px 4px}
details.do>summary:hover{color:var(--accent)}
details.do>summary::-webkit-details-marker{display:none}
details.do>summary:before{content:"▸";color:var(--accent);width:10px}
details.do[open]>summary:before{content:"▾"}
.fc{display:inline-block;min-width:26px;text-align:center;font-family:var(--f-mono);font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.fc.ST{color:var(--ok)}.fc.MX{color:var(--info)}.fc.CO{color:var(--err)}.fc.CF,.fc.DC{color:var(--muted)}.fc.SP,.fc.SG,.fc.SE{color:var(--warn)}
.sev{display:inline-flex;align-items:center;gap:6px;width:76px;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.sev:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.sev.error{color:var(--err)}.sev.warning{color:var(--warn)}.sev.info{color:var(--info)}
tr.sv-error td:first-child{box-shadow:inset 3px 0 0 var(--err)}tr.sv-warning td:first-child{box-shadow:inset 3px 0 0 var(--warn)}tr.sv-info td:first-child{box-shadow:inset 3px 0 0 var(--info)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:12.5px}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);font-weight:600}
/* source */
pre.src{margin:0;font-family:var(--f-mono);font-size:12px;line-height:1.6;padding:14px;white-space:pre;overflow:auto;max-height:calc(100vh - 210px)}
.x-t{color:var(--accent)}.x-a{color:var(--accent2)}.x-v{color:var(--ok)}.x-c{color:var(--muted)}
textarea.srcedit{width:100%;height:calc(100vh - 230px);font-family:var(--f-mono);font-size:12px;line-height:1.55;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical}
/* sld */
.sldwrap{overflow-x:auto;padding:6px 0}
.sld text{font-family:var(--f-mono)}
.sld .bus{stroke:var(--accent);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--accent))}
.sld .wire{stroke:var(--fg);stroke-width:1.5;fill:none;opacity:.85}
.sld .sym{stroke:var(--fg);stroke-width:1.6;fill:var(--panel-solid)}
.sld .node{fill:var(--accent);filter:drop-shadow(0 0 4px var(--accent))}
.sld .sl{fill:var(--accent);font-size:12px;font-weight:500;letter-spacing:.06em}
.sld .el{fill:var(--fg);font-size:11px}.sld .et,.sld .bd{fill:var(--muted);font-size:9.5px}
.sld .bl{fill:var(--fg);font-size:12px;font-weight:600}
.sld .eq{cursor:pointer}.sld .eq:hover .sym,.sld .eq:hover .wire{stroke:var(--accent)}
.sld .hit{fill:transparent}
.sld .lnt{fill:var(--accent2);font-size:8.5px}
/* matrix */
.mx td,.mx th{text-align:center}
.mx td.h,.mx th.h{text-align:left}
.mx .cellv{display:inline-block;min-width:28px;padding:3px 7px;border-radius:6px;font-family:var(--f-mono);font-size:11px;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
/* empty / boot */
.drop{border:1px dashed var(--line-hi);border-radius:16px;padding:44px 22px;text-align:center;display:grid;gap:14px;justify-items:center;max-width:660px;margin:40px auto;background:var(--panel)}
.dropzone-on main{outline:2px dashed var(--accent);outline-offset:-10px}
.boot{max-width:620px;margin:60px auto;text-align:center;color:var(--muted);line-height:1.6}
.boot b{color:var(--fg)}
/* toast & modal */
#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:50;max-width:min(420px,calc(100vw - 32px));pointer-events:none}
.tst{background:var(--panel-solid);color:var(--fg);border:1px solid var(--line-hi);border-left:3px solid var(--accent);padding:9px 13px;border-radius:8px;font-size:13px;box-shadow:var(--shadow),var(--glow)}
.tst.err{border-left-color:var(--err);color:var(--err)}
#modal{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:40;padding:16px}
.mbox{position:relative;background:var(--panel-solid);border:1px solid var(--line-hi);border-radius:14px;width:min(880px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow),var(--glow)}
.mbox .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mbox .mb{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbox textarea{width:100%;height:46vh;font-family:var(--f-mono);font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.diffadd{color:var(--ok)}.diffdel{color:var(--err)}.diffchg{color:var(--warn)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:var(--line-hi)}
@media (max-width:900px){
