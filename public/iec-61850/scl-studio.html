   <div class="grid2"><div><h3 style="margin-bottom:6px">Data set ${esc(at(c.cb,'datSet'))}</h3><div class="mono" style="font-size:12px;line-height:1.7">${c.ds?kids(c.ds,'FCDA').map(f=>esc(fcdaRef(f))).join('<br>'):'<span class="muted">No data set</span>'}</div></div>
   <div><h3 style="margin-bottom:6px">Attributes</h3><dl class="kv">${[...c.cb.attributes].map(a=>`<dt>${esc(a.name)}</dt><dd>${esc(a.value)}</dd>`).join('')}${kids(c.cb).filter(k=>k.attributes.length).map(k=>`<dt>${k.localName}</dt><dd>${[...k.attributes].map(a=>a.name+'='+a.value).map(esc).join(', ')}</dd>`).join('')}</dl></div></div></div>`})()}</div>`};

V.templates=()=>{const I=cached('tidx',idx),U=cached('used',()=>usedTypes(kids(root(),'IED'),I)),q=S.tq.toLowerCase();
  const refs=(k,id)=>{const r=[];if(k==='LNodeType')for(const l of [...all(root(),'LN0'),...all(root(),'LN')])if(at(l,'lnType')===id)r.push(at(l.closest('IED'),'name')+' '+at(l.parentElement,'inst')+'/'+lnName(l));
    if(k==='DOType')for(const T of [...I.LNodeType.values(),...I.DOType.values()])for(const d of kids(T))if((d.localName==='DO'||d.localName==='SDO')&&at(d,'type')===id)r.push(at(T,'id')+'.'+at(d,'name'));
    if(k==='DAType'||k==='EnumType')for(const T of [...I.DOType.values(),...I.DAType.values()])for(const d of kids(T))if((d.localName==='DA'||d.localName==='BDA')&&at(d,'type')===id&&(at(d,'bType')===(k==='DAType'?'Struct':'Enum')))r.push(at(T,'id')+'.'+at(d,'name'));return r};
  const [sk,sid]=S.tpl.split(':');const sel=sk&&I[sk]&&I[sk].get(sid);
  const lists=Object.entries(I).map(([k,m])=>`<div class="grp">${k} · ${m.size}</div>`+[...m.values()].filter(e=>!q||(at(e,'id')+' '+at(e,'lnClass')+' '+at(e,'cdc')).toLowerCase().includes(q)).slice(0,250).map(e=>{const id=at(e,'id'),u=U[k].has(id);return`<div class="li${S.tpl===k+':'+id?' on':''}${u?'':' dim'}" data-act="picktpl" data-k="${k}:${esc(id)}"><div style="min-width:0"><div class="t mono">${esc(id)}</div><div class="s">${esc(at(e,'lnClass')||at(e,'cdc')||(k==='EnumType'?kids(e,'EnumVal').length+' values':kids(e,'BDA').length+' components'))}${u?'':' · unused'}</div></div></div>`}).join('')).join('');
  let det='<div class="pane"><div class="pb muted">Select a data type to see its structure and where it is used.</div></div>';
  if(sel){const r=refs(sk,sid),ch=kids(sel).filter(c=>c.localName!=='Text');
    det=`<div class="pane"><div class="ph"><div><div class="eyebrow">${sk}</div><h3 class="mono">${esc(sid)}</h3></div><div class="row">${at(sel,'lnClass')?`<span class="chip">${esc(at(sel,'lnClass'))}</span>`:''}${at(sel,'cdc')?`<span class="chip">${esc(at(sel,'cdc'))}</span>`:''}<button class="btn sm" data-act="goto" data-path="${pathOf(sel)}">Edit in Explorer</button></div></div><div class="pb">
     <div class="tbl"><table><tr><th>${sk==='EnumType'?'ord':'Name'}</th><th>${sk==='EnumType'?'Literal':'Type'}</th><th>FC</th><th>Default</th></tr>${ch.map(c=>{if(c.localName==='EnumVal')return`<tr><td class="mono num">${esc(at(c,'ord'))}</td><td class="mono">${esc(c.textContent.trim())||'<span class="muted">(empty)</span>'}</td><td></td><td></td></tr>`;
      const t=at(c,'type'),bt=at(c,'bType'),tk=c.localName==='DO'||c.localName==='SDO'?'DOType':bt==='Enum'?'EnumType':bt==='Struct'?'DAType':'';
      return`<tr><td class="mono">${c.localName==='SDO'?'<span class="muted">SDO </span>':''}${esc(at(c,'name'))}</td><td class="mono">${bt?esc(bt)+' ':''}${t?(tk&&I[tk].has(t)?`<a href="#" data-act="picktpl" data-k="${tk}:${esc(t)}" style="color:var(--accent)">${esc(t)}</a>`:`<span class="bad">${esc(t)}</span>`):''}</td><td>${at(c,'fc')?`<span class="fc ${at(c,'fc')}">${at(c,'fc')}</span>`:''}</td><td class="mono">${esc(kid(c,'Val')?.textContent.trim()||'')}</td></tr>`}).join('')}</table></div>
     <h3 style="margin:14px 0 6px">Used by (${r.length})</h3><div class="mono muted" style="font-size:12px;line-height:1.7">${r.map(esc).join('<br>')||'Not referenced anywhere.'}</div></div></div>`}
  const nUn=Object.entries(I).reduce((a,[k,m])=>a+[...m.keys()].filter(id=>!U[k].has(id)).length,0);
  return`<div class="vh"><div><div class="eyebrow">DataTypeTemplates</div><h1>Data types</h1><p>Logical node, data object, data attribute and enumeration types with usage tracking.</p></div><div class="row"><button class="btn sm" data-act="cleanup" ${nUn?'':'disabled'}>${S.confirm==='cleanup'?`Confirm removing ${nUn}`:`Remove ${nUn} unused`}</button></div></div>
  <div class="split"><div class="pane"><div class="ph"><input class="f" id="tq" data-inp="tq" placeholder="Filter by id, class or CDC" value="${esc(S.tq)}" style="width:100%"></div><div class="list">${lists}</div></div>${det}</div>`};

V.validation=()=>{const R=S.vres,f=S.vf,list=R.filter(x=>f==='all'||x.sev===f),c=s=>R.filter(x=>x.sev===s).length;const rules={};R.forEach(x=>rules[x.rule]=(rules[x.rule]||0)+1);
  return`<div class="vh"><div><div class="eyebrow">IEC 61850-6 semantic checks</div><h1>Validation</h1><p>Type references, data set and control block integrity, ExtRef bindings, service limits, network addressing, and unused types. Select a finding to edit the element.</p></div>
  <div class="seg" role="group" aria-label="Severity">${[['all','All '+R.length],['error','Errors '+c('error')],['warning','Warnings '+c('warning')],['info','Notes '+c('info')]].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="vf" data-f="${k}">${l}</button>`).join('')}</div></div>
  <div class="row" style="margin-bottom:12px"><button class="btn sm ${S.vstale?'pri':''}" data-act="validate">${S.vbusy?'Validating…':'Run validation now'}</button><span class="muted mono" style="font-size:11.5px">${S.vms?'last run '+S.vms+' ms':''}${S.vstale?' · file edited since last run':''}</span>${Object.entries(rules).map(([k,n])=>`<span class="chip">${esc(k)} ${n}</span>`).join('')}</div>
  <div class="card" style="padding:0"><div class="tbl"><table><tr><th>Severity</th><th>Rule</th><th>Finding</th></tr>${list.slice(0,S.vlim).map(x=>`<tr class="click sv-${x.sev}" data-act="goto" data-path="${x.el?pathOf(x.el):''}"><td><span class="sev ${x.sev}">${x.sev}</span></td><td class="mono" style="white-space:nowrap">${esc(x.rule)}</td><td>${esc(x.msg)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted" style="padding:16px">Nothing to report at this severity.</td></tr>'}</table></div>${list.length>S.vlim?`<div class="row" style="padding:12px"><span class="muted">Showing ${S.vlim} of ${list.length} findings.</span><button class="btn sm" data-act="vmore">Show 500 more</button></div>`:''}</div>`};

function treeHTML(e,p,dep){const ch=[...e.children],open=S.open.has(p),lb=label(e);
  let h=`<div class="tn${S.sel===p?' on':''}" style="padding-left:${8+dep*14}px" data-act="tsel" data-path="${p}"><span class="tw" data-act="ttog" data-path="${p}">${ch.length?(open?'▾':'▸'):''}</span><span class="tg">${esc(e.localName)}</span>${lb?` <span class="ta">${esc(trunc(lb,48))}</span>`:''}</div>`;
  if(open){ch.slice(0,300).forEach((c,i)=>h+=treeHTML(c,p===''?String(i):p+'/'+i,dep+1));if(ch.length>300)h+=`<div class="tn muted" style="padding-left:${22+dep*14}px;cursor:default">… ${ch.length-300} more children. Use search to find them.</div>`}return h}
function editorHTML(e){const p=pathOf(e),tag=e.localName,attrs=[...e.attributes],hints=Object.keys(DEFAULTS[tag]||{}).filter(k=>!e.hasAttribute(k)),childOpts=CHILDREN[tag]||[];
  const hasEl=e.children.length>0;const opt=n=>OPTS[n+'_'+tag]||OPTS[n]||(BOOLS.has(n)?['true','false']:null);
  const crumbs=[];let x=e;while(x){crumbs.unshift([x.localName,pathOf(x),label(x)]);x=x.parentElement}
  return`<div class="pane"><div class="ph"><div style="min-width:0"><div class="eyebrow" style="white-space:normal">${crumbs.slice(-5).map(([t,pp,l])=>`<a href="#" data-act="tsel" data-path="${pp}" style="color:inherit">${esc(t)}${l?' '+esc(trunc(l,18)):''}</a>`).join(' › ')}</div><h3 class="mono">&lt;${esc(tag)}&gt; ${esc(label(e))}</h3>${(window.SCL_ELEM||{})[tag]?`<button class="btn sm" data-act="help" data-t="${window.SCL_ELEM[tag]}" style="margin-top:6px">? What is &lt;${esc(tag)}&gt;</button>`:''}</div>
   <div class="row"><button class="btn sm" data-act="mvup">↑</button><button class="btn sm" data-act="mvdn">↓</button>${e.parentElement?`<button class="btn sm" data-act="dup">Duplicate</button><button class="btn sm danger" data-act="del">${S.confirm==='del:'+p?'Confirm delete':'Delete'}</button>`:''}</div></div><div class="pb stack">
   <div><h3 style="margin-bottom:6px">Attributes</h3><div class="tbl"><table>${attrs.map(a=>{const o=opt(a.name);const id='a_'+p.replace(/\//g,'_')+'_'+a.name.replace(/[^\w]/g,'_');const fh=(window.SCL_FIELD||{})[a.name];return`<tr><td class="mono muted" style="width:1%;white-space:nowrap" data-tip="${esc(tag)}:${esc(a.name)}">${esc(a.name)}${fh?`<button class="qb" data-act="help" data-t="${fh[1]}" aria-label="Help for ${esc(a.name)}">?</button>`:''}</td><td><input class="cell" id="${id}" data-chg="attr" data-name="${esc(a.name)}" value="${esc(a.value)}" ${o?`list="dl_${esc(a.name)}"`:''} aria-label="${esc(a.name)}">${o?`<datalist id="dl_${esc(a.name)}">${o.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`:''}</td><td style="width:1%"><button class="btn sm" data-act="rmattr" data-name="${esc(a.name)}" aria-label="Remove ${esc(a.name)}">×</button></td></tr>`}).join('')||'<tr><td class="muted">No attributes</td></tr>'}</table></div>
    ${hints.length?`<div class="row" style="margin-top:8px">${hints.map(h=>`<button class="btn sm" data-act="hint" data-name="${h}">+ ${h}</button>`).join('')}</div>`:''}
    <div class="row" style="margin-top:8px"><input class="f" id="nan" placeholder="attribute" style="width:120px"><input class="f" id="nav" placeholder="value" style="flex:1;min-width:100px"><button class="btn sm" data-act="addattr">Add attribute</button></div></div>
   ${!hasEl&&(TEXT_TAGS.has(tag)||e.textContent.trim())?`<div><h3 style="margin-bottom:6px">Content</h3><textarea class="f" id="txt_${p.replace(/\//g,'_')}" data-chg="text" rows="2" style="width:100%;font-family:var(--f-mono);font-size:12px">${esc(e.textContent.trim())}</textarea></div>`:''}
   ${childOpts.length?`<div><h3 style="margin-bottom:6px">Add child element</h3><div class="row"><select class="f" id="addc">${childOpts.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn sm" data-act="addchild">Add</button></div></div>`:''}
   <div><h3 style="margin-bottom:6px">XML</h3><pre class="src" style="max-height:260px;border:1px solid var(--line);border-radius:4px">${hl(prettyEl(e))}</pre></div></div></div>`}
function prettyEl(e){const d=document.implementation.createDocument(null,null,null);d.appendChild(d.importNode(e,true));return pretty(d).replace(/^<\?xml[^>]*>\n/,'')}
V.explorer=()=>{if(!byPath(S.sel))S.sel='';const e=byPath(S.sel);let left;
  if(S.q){const q=S.q.toLowerCase();const res=cached('q:'+q,()=>{const res=[];const walk=el=>{if(res.length>400)return;const s=el.localName+' '+[...el.attributes].map(a=>a.value).join(' ')+(el.children.length?'':' '+el.textContent);if(s.toLowerCase().includes(q))res.push(el);for(const c of el.children)walk(c)};walk(root());return res});
    left=`<div class="tree">${res.map(r=>{const p=pathOf(r);return`<div class="tn${S.sel===p?' on':''}" data-act="tsel" data-path="${p}"><span class="tg">${esc(r.localName)}</span> <span class="ta">${esc(trunc(label(r),40))}</span><span class="muted" style="margin-left:auto;padding-left:8px;font-size:10.5px">${esc(r.parentElement?r.parentElement.localName:'')}</span></div>`}).join('')||'<div class="pb muted">No matches.</div>'}${res.length>400?'<div class="pb muted">Showing first 400 matches.</div>':''}</div>`}
  else left=`<div class="tree">${treeHTML(root(),'',0)}</div>`;
  return`<div class="vh"><div><div class="eyebrow">Schema-guided editor</div><h1>Explorer</h1><p>Full element tree. Child elements are inserted in schema order; every edit can be undone.</p></div><div class="row"><button class="btn sm" data-act="expandall">Expand to depth 3</button><button class="btn sm" data-act="collapse">Collapse</button></div></div>
  <div class="split"><div class="pane"><div class="ph"><input class="f" id="q" data-inp="q" placeholder="Search names, attributes, values" value="${esc(S.q)}" style="width:100%"></div>${left}</div>${e?editorHTML(e):'<div class="pane"><div class="pb muted">Select an element.</div></div>'}</div>`};

function hl(x){return esc(x).replace(/(&lt;\/?)([\w:.-]+)/g,'$1<span class="x-t">$2</span>').replace(/([\w:.-]+)=(&quot;[^&]*?(?:&amp;[^&]*?)*&quot;)/g,'<span class="x-a">$1</span>=<span class="x-v">$2</span>').replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<span class="x-c">$1</span>')}
V.source=()=>{const x=cached('pretty',()=>pretty(S.doc));const LIM=600000,cut=x.length>LIM,canEdit=x.length<8e6;
  return`<div class="vh"><div><div class="eyebrow">${(x.length/1048576).toFixed(2)} MB</div><h1>XML source</h1><p>${S.src?'Edit the XML directly, then apply. The document is re-parsed and re-validated.':cut?'Large file: the first 600 KB is shown here. Use Export or Copy XML for the complete file.':'Formatted, read-only view.'}</p></div>
  <div class="row">${S.src?'<button class="btn sm pri" data-act="srcapply">Apply changes</button><button class="btn sm" data-act="srccancel">Cancel</button>':`<button class="btn sm" data-act="srcedit" ${canEdit?'':'disabled title="Files over 8 MB are edited in Explorer instead"'}>Edit source</button><button class="btn sm" data-act="copy">Copy XML</button>`}</div></div>
  <div class="card" style="padding:0">${S.src?`<textarea class="srcedit" id="srcta" spellcheck="false">${esc(x)}</textarea>`:`<pre class="src">${hl(cut?x.slice(0,LIM):x)}${cut?'\n\n<span class="x-c">… '+((x.length-LIM)/1048576).toFixed(1)+' MB more not shown</span>':''}</pre>`}</div>`};
function keyMap(d){const m=new Map();const walk=(e,p)=>{const k=e.localName+(label(e)?'['+label(e)+']':'');let key=p?p+'/'+k:k,i=2;while(m.has(key))key=(p?p+'/':'')+k+'#'+i++;m.set(key,e);for(const c of e.children)walk(c,key)};walk(d.documentElement,'');return m}
V.help=()=>{const H=window.SCL_HELP||[],q=S.hq.toLowerCase();if(!H.length)return'<div class="card">Help library failed to load.</div>';
  const list=H.filter(t=>!q||(t.title+' '+t.keys+' '+t.body.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q));let cur=H.find(t=>t.id===S.ht)||H[0];let g='';

};
const CHG={
  pattr:t=>{const e=byPath(t.dataset.path),n=t.dataset.name,v=t.value.trim(),old=at(e,n),tag=e.localName;if(old===v&&e.hasAttribute(n)===(v!==''))return;if(n==='name'&&!v){toast('A name is required','err');render();return}
    mutate(`${tag} ${n} = ${v||'(cleared)'}`,()=>{if(v===''&&n!=='name')e.removeAttribute(n);else e.setAttribute(n,v);
      if(n==='name'&&tag==='DataSet')for(const c of kids(e.parentElement))if(CBRE.test(c.localName)&&at(c,'datSet')===old)c.setAttribute('datSet',v);
      if(n==='name'&&/^(GSEControl|SampledValueControl|ReportControl)$/.test(tag)){const iN=at(e.closest('IED'),'name'),li=at(e.closest('LDevice'),'inst');
        if(tag!=='ReportControl')for(const g of all(root(),tag==='GSEControl'?'GSE':'SMV'))if(at(g,'cbName')===old&&at(g,'ldInst')===li&&at(g.parentElement,'iedName')===iN)g.setAttribute('cbName',v);
        for(const er of all(root(),'ExtRef'))if(at(er,'iedName')===iN&&at(er,'srcCBName')===old&&(at(er,'srcLDInst')||at(er,'ldInst'))===li)er.setAttribute('srcCBName',v)}})},
  pflag:t=>{const e=byPath(t.dataset.path),c=t.dataset.child,n=t.dataset.name;mutate(`${c} ${n} = ${t.checked}`,()=>{const k=kid(e,c)||insertOrdered(e,mk(c));k.setAttribute(n,t.checked?'true':'false')})},
  pchild:t=>{const e=byPath(t.dataset.path),c=t.dataset.child,n=t.dataset.name,v=t.value.trim();mutate(`${c} ${n} = ${v}`,()=>{const k=kid(e,c)||insertOrdered(e,mk(c));if(v)k.setAttribute(n,v);else k.removeAttribute(n)})},
  pick:t=>{const k=t.dataset.k,o=['ln','do','fc','da'];S.pick[k]=t.value;for(const j of o.slice(o.indexOf(k)+1))S.pick[j]='';if(k==='do'){const f=[...document.querySelectorAll('#pk_fc option')];}render()},
  attr:t=>{const e=selEl(),n=t.dataset.name,v=t.value;if(e.getAttribute(n)===v)return;mutate(`${e.localName} @${n} = ${v}`,()=>e.setAttribute(n,v))},
  text:t=>{const e=selEl();if(e.textContent.trim()===t.value.trim())return;mutate(`Edited ${e.localName} content`,()=>{e.textContent=t.value.trim()})},
  p:t=>{const o=byPath(t.dataset.path),ty=t.dataset.type,v=t.value.trim();mutate(`${label(o)} ${ty} = ${v||'(removed)'}`,()=>setP(o,ty,v))},
  tm:t=>{const o=byPath(t.dataset.path),v=t.value.trim();if(v&&!/^\d+$/.test(v)){toast('Time must be whole milliseconds','err');render();return}mutate(`${label(o)} ${t.dataset.tag} = ${v}`,()=>setTime(o,t.dataset.tag,v))},
  setval:t=>{const ln=byPath(S.ln),dp=t.dataset.dp.split('.'),ap=t.dataset.ap.split('.');mutate(`${lnName(ln)}.${dp.join('.')}.${ap.join('.')} = ${t.value}`,()=>setInstVal(ln,dp,ap,t.value))}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){if(t.tagName==='A')e.preventDefault();f(t,e)}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t,e)});
let IT=0;document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(t){S[t.dataset.inp]=t.value;clearTimeout(IT);IT=setTimeout(render,S.big?450:120)}});
document.addEventListener('keydown',e=>{const m=e.ctrlKey||e.metaKey;if(e.key==='Escape'&&!$('#modal').hidden){$('#modal').hidden=true;return}
  if(m&&e.key.toLowerCase()==='z'&&!e.shiftKey&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();undo()}
  else if(m&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();redo()}
  else if(m&&e.key.toLowerCase()==='s'){e.preventDefault();ACT.export()}else if(m&&e.key.toLowerCase()==='o'){e.preventDefault();ACT.open()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});
$('#fileA').addEventListener('change',e=>{const f=e.target.files[0];if(f)readFile(f,load);e.target.value=''});
$('#fileB').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;readFile(f,(t,n)=>{try{S.cmp=parse(t);S.cmpName=n+' '+Date.now();S.cmpLabel=n;render()}catch(x){toast('Could not read '+n+': '+x.message,'err')}});e.target.value=''});
$('#fileI').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;readFile(f,(t,n)=>{try{const d=parse(t);let names=[];if(mutate('Imported IED from '+n,()=>{names=importIEDs(d,n)})){S.ied=names[0];S.view='ieds';render();toast('Imported '+names.join(', ')+' with data types merged')}}catch(x){toast('Import failed: '+x.message,'err')}});e.target.value=''});
window.addEventListener('dragover',e=>{e.preventDefault();$('#app').classList.add('dropzone-on')});
window.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#app').classList.remove('dropzone-on')});
window.addEventListener('drop',e=>{e.preventDefault();$('#app').classList.remove('dropzone-on');const f=e.dataTransfer.files[0];if(f)readFile(f,load)});
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
load($('#sample').textContent.trim(),'S13_Sample.scd');
</script>
</body>
</html>
