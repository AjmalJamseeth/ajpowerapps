<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.ajpowerapps.com/calculators/iec-61850-scl-editor">
<title>SCL Studio — IEC 61850 SCD / ICD / CID Viewer &amp; Editor | AJapps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: control-room HUD — glass command bar, icon rail, split panes on a blueprint grid. Dark-first, light theme mirrored. */
:root{
  --bg:#050a13; --grid:rgba(56,140,220,.07); --halo1:rgba(34,211,238,.13); --halo2:rgba(167,139,250,.10);
  --panel:#0b1626; --panel-solid:#0b1626; --panel2:#102036; --line:#1d3554; --line-hi:#2f5a8f;
  --fg:#f1f6fd; --muted:#a3b6cf; --accent:#22d3ee; --accent2:#a78bfa; --accent-ink:#03121b;
  --accent-soft:rgba(34,211,238,.12); --sel:rgba(34,211,238,.09); --hi:rgba(255,255,255,.05);
  --glow:0 0 0 1px rgba(34,211,238,.4),0 0 22px rgba(34,211,238,.22); --shadow:0 10px 30px rgba(0,0,0,.35);
  --ok:#34d399; --warn:#fbbf24; --err:#fb7185; --info:#818cf8; --scrim:rgba(2,6,12,.7);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#edf2f9; --grid:rgba(30,90,170,.06); --halo1:rgba(2,132,199,.10); --halo2:rgba(124,58,237,.08);
  --panel:#ffffff; --panel-solid:#ffffff; --panel2:#f1f5fb; --line:#d0dbea; --line-hi:#9fb6d3;
  --fg:#071226; --muted:#41536d; --accent:#0284c7; --accent2:#7c3aed; --accent-ink:#ffffff;
  --accent-soft:rgba(2,132,199,.10); --sel:rgba(2,132,199,.08); --hi:rgba(255,255,255,.9);
  --glow:0 0 0 1px rgba(2,132,199,.35),0 6px 18px rgba(2,132,199,.16); --shadow:0 8px 24px rgba(20,50,90,.10);
  --ok:#059669; --warn:#b45309; --err:#e11d48; --info:#4f46e5; --scrim:rgba(15,30,55,.45); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#edf2f9; --grid:rgba(30,90,170,.06); --halo1:rgba(2,132,199,.10); --halo2:rgba(124,58,237,.08);
  --panel:#ffffff; --panel-solid:#ffffff; --panel2:#f1f5fb; --line:#d0dbea; --line-hi:#9fb6d3;
  --fg:#071226; --muted:#41536d; --accent:#0284c7; --accent2:#7c3aed; --accent-ink:#ffffff;
  --accent-soft:rgba(2,132,199,.10); --sel:rgba(2,132,199,.08); --hi:rgba(255,255,255,.9);
  --glow:0 0 0 1px rgba(2,132,199,.35),0 6px 18px rgba(2,132,199,.16); --shadow:0 8px 24px rgba(20,50,90,.10);
  --ok:#059669; --warn:#b45309; --err:#e11d48; --info:#4f46e5; --scrim:rgba(15,30,55,.45); color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%}
body{color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal;
  background:var(--bg);
  background-image:radial-gradient(900px 500px at 85% -10%,var(--halo1),transparent 60%),radial-gradient(700px 500px at -10% 110%,var(--halo2),transparent 60%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,28px 28px,28px 28px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:216px 1fr}
/* top bar */
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent2) 70%,transparent);opacity:.7}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 6px var(--accent-soft))}
.logo .ring{fill:none;stroke:var(--accent);stroke-width:1.6;transform-origin:16px 16px;animation:spin 18s linear infinite}
.logo .core{fill:none;stroke:var(--accent2);stroke-width:1.6}
.logo .n{fill:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05;background:linear-gradient(90deg,var(--fg),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fileinfo{display:flex;align-items:center;gap:8px;min-width:0;flex:1;flex-wrap:wrap}
.fname{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.chip.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,transparent)}.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}.chip.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent)}.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.dirty{font-family:var(--f-mono);font-size:10.5px;color:var(--warn);letter-spacing:.08em;text-transform:uppercase}
.status{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-family:var(--f-mono);font-size:11.5px}
.status:hover{box-shadow:var(--glow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}.dot.err{background:var(--err);box-shadow:0 0 10px var(--err);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:box-shadow .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--accent);box-shadow:var(--glow)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--err)}.btn.danger:hover{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.icon{padding:6px 9px;line-height:0}
.btn:disabled{opacity:.4;cursor:default}
.btn svg,.nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto;padding-left:max(10px,env(safe-area-inset-left,0px))}
.rail .cap{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.nav{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;font-weight:500;width:100%;color:var(--muted);transition:color .15s,background .15s}
.nav span{flex:1;color:var(--fg)}
.nav:hover{background:var(--panel2);color:var(--accent)}
.nav.on{background:linear-gradient(90deg,var(--accent-soft),transparent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent)}
.nav.on span{color:var(--accent);font-weight:600}
.nav.on:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.nav small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.rail .sep{height:1px;background:var(--line);margin:10px 4px}
.rail .hint{font-size:11.5px;color:var(--muted);padding:4px 10px;line-height:1.5}
/* main */
main{overflow:auto;padding-block:20px 48px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));min-width:0}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:27px;font-weight:700}h2{font-size:17px;text-transform:uppercase;letter-spacing:.06em}h3{font-size:14.5px;letter-spacing:.03em}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.vh p{margin:4px 0 0;color:var(--muted);max-width:72ch;line-height:1.5}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.eyebrow:before{content:"";width:14px;height:1px;background:var(--accent)}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.card:before,.pane:before{content:"";position:absolute;top:-1px;left:16px;width:40px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));pointer-events:none}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:10px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:hidden;box-shadow:inset 0 1px 0 var(--hi)}
.tile:after{content:"";position:absolute;right:-20px;top:-20px;width:60px;height:60px;border-radius:50%;background:radial-gradient(var(--accent-soft),transparent 70%)}
.tile b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tile span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--f-mono);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line-hi);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sel)}
tr.on td{background:var(--accent-soft)}
.mono{font-family:var(--f-mono);font-size:12.5px;font-feature-settings:'zero' 0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.split{display:grid;grid-template-columns:minmax(240px,330px) minmax(0,1fr);gap:16px;align-items:start}
.split3{display:grid;grid-template-columns:minmax(170px,220px) minmax(250px,320px) minmax(0,1fr);gap:16px;align-items:start}
.pane{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;max-height:calc(100vh - 190px);overflow:auto;box-shadow:var(--shadow)}
.pane>.ph{position:sticky;top:0;background:var(--panel-solid);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;z-index:1}
.pane>.pb{padding:12px}
.list{display:flex;flex-direction:column;padding:4px 0}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;margin:1px 6px;cursor:pointer;border-radius:7px;border:1px solid transparent;transition:background .12s}
.li:hover{background:var(--sel)}
.li.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.li .t{font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.dim{opacity:.5}
.grp{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);padding:12px 14px 4px}
input.f,select.f,textarea.f{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent);box-shadow:var(--glow);outline:none}
input.cell{background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 6px;font-family:var(--f-mono);font-size:12.5px;font-weight:500;width:100%;min-width:90px}
input.cell:hover{border-color:var(--line)}input.cell:focus{border-color:var(--accent);background:var(--panel2);box-shadow:var(--glow);outline:none}
select.cell{background:var(--panel2);border:1px solid var(--line);border-radius:5px;font-family:var(--f-mono);font-size:12px;padding:2px 4px}
.bad input.cell,.bad{color:var(--err)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;font-size:13px}
.kv dt{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}.kv dd{margin:0;font-family:var(--f-mono);font-size:12px;word-break:break-all}
/* tree */
.tree{font-family:var(--f-mono);font-size:12px;padding:6px 0}
.tn{display:flex;align-items:center;gap:4px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.tn:hover{background:var(--sel)}
.tn.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.tw{width:14px;color:var(--muted);text-align:center;flex:none}
.tg{color:var(--accent)}.ta{color:var(--muted)}
/* data model */
details.do{border-bottom:1px solid var(--line)}
details.do>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:8px 4px}
details.do>summary:hover{color:var(--accent)}
details.do>summary::-webkit-details-marker{display:none}
details.do>summary:before{content:"▸";color:var(--accent);width:10px}
details.do[open]>summary:before{content:"▾"}
.fc{display:inline-block;min-width:26px;text-align:center;font-family:var(--f-mono);font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.fc.ST{color:var(--ok)}.fc.MX{color:var(--info)}.fc.CO{color:var(--err)}.fc.CF,.fc.DC{color:var(--muted)}.fc.SP,.fc.SG,.fc.SE{color:var(--warn)}
.sev{display:inline-flex;align-items:center;gap:6px;width:76px;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.sev:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.sev.error{color:var(--err)}.sev.warning{color:var(--warn)}.sev.info{color:var(--info)}
tr.sv-error td:first-child{box-shadow:inset 3px 0 0 var(--err)}tr.sv-warning td:first-child{box-shadow:inset 3px 0 0 var(--warn)}tr.sv-info td:first-child{box-shadow:inset 3px 0 0 var(--info)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:12.5px}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);font-weight:600}
/* source */
pre.src{margin:0;font-family:var(--f-mono);font-size:12px;line-height:1.6;padding:14px;white-space:pre;overflow:auto;max-height:calc(100vh - 210px)}
.x-t{color:var(--accent)}.x-a{color:var(--accent2)}.x-v{color:var(--ok)}.x-c{color:var(--muted)}
textarea.srcedit{width:100%;height:calc(100vh - 230px);font-family:var(--f-mono);font-size:12px;line-height:1.55;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical}
/* sld */
.sldwrap{overflow-x:auto;padding:6px 0}
.sld text{font-family:var(--f-mono)}
.sld .bus{stroke:var(--accent);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--accent))}
.sld .wire{stroke:var(--fg);stroke-width:1.5;fill:none;opacity:.85}
.sld .sym{stroke:var(--fg);stroke-width:1.6;fill:var(--panel-solid)}
.sld .node{fill:var(--accent);filter:drop-shadow(0 0 4px var(--accent))}
.sld .sl{fill:var(--accent);font-size:12px;font-weight:500;letter-spacing:.06em}
.sld .el{fill:var(--fg);font-size:11px}.sld .et,.sld .bd{fill:var(--muted);font-size:9.5px}
.sld .bl{fill:var(--fg);font-size:12px;font-weight:600}
.sld .eq{cursor:pointer}.sld .eq:hover .sym,.sld .eq:hover .wire{stroke:var(--accent)}
.sld .hit{fill:transparent}
.sld .lnt{fill:var(--accent2);font-size:8.5px}
/* matrix */
.mx td,.mx th{text-align:center}
.mx td.h,.mx th.h{text-align:left}
.mx .cellv{display:inline-block;min-width:28px;padding:3px 7px;border-radius:6px;font-family:var(--f-mono);font-size:11px;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
/* empty / boot */
.drop{border:1px dashed var(--line-hi);border-radius:16px;padding:44px 22px;text-align:center;display:grid;gap:14px;justify-items:center;max-width:660px;margin:40px auto;background:var(--panel)}
.dropzone-on main{outline:2px dashed var(--accent);outline-offset:-10px}
.boot{max-width:620px;margin:60px auto;text-align:center;color:var(--muted);line-height:1.6}
.boot b{color:var(--fg)}
/* toast & modal */
#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:50;max-width:min(420px,calc(100vw - 32px));pointer-events:none}
.tst{background:var(--panel-solid);color:var(--fg);border:1px solid var(--line-hi);border-left:3px solid var(--accent);padding:9px 13px;border-radius:8px;font-size:13px;box-shadow:var(--shadow),var(--glow)}
.tst.err{border-left-color:var(--err);color:var(--err)}
#modal{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:40;padding:16px}
.mbox{position:relative;background:var(--panel-solid);border:1px solid var(--line-hi);border-radius:14px;width:min(880px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow),var(--glow)}
.mbox .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mbox .mb{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbox textarea{width:100%;height:46vh;font-family:var(--f-mono);font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.diffadd{color:var(--ok)}.diffdel{color:var(--err)}.diffchg{color:var(--warn)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:var(--line-hi)}
@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;min-height:100%}

   <DO name="Mod" type="ENC_Mod"/><DO name="Beh" type="ENS_Beh"/><DO name="Loc" type="SPS_T"/><DO name="OpCnt" type="INS_T"/><DO name="Pos" type="DPC_T"/>
  </LNodeType>
  <LNodeType id="CSWI_T" lnClass="CSWI">

  <DOType id="ENS_Beh" cdc="ENS">
   <DA name="stVal" bType="Enum" type="BehaviourModeKind" fc="ST" dchg="true"/><DA name="q" bType="Quality" fc="ST" qchg="true"/><DA name="t" bType="Timestamp" fc="ST"/>
  </DOType>
  <DOType id="ENS_Health" cdc="ENS">
   <DA name="stVal" bType="Enum" type="HealthKind" fc="ST" dchg="true"/><DA name="q" bType="Quality" fc="ST" qchg="true"/><DA name="t" bType="Timestamp" fc="ST"/>
  </DOType>

   <DA name="vendor" bType="VisString255" fc="DC"/><DA name="swRev" bType="VisString255" fc="DC"/><DA name="d" bType="VisString255" fc="DC"/><DA name="configRev" bType="VisString255" fc="DC"/>
  </DOType>

  </DOType>
  <DOType id="SPS_T" cdc="SPS">
   <DA name="stVal" bType="BOOLEAN" fc="ST" dchg="true"/><DA name="q" bType="Quality" fc="ST" qchg="true"/><DA name="t" bType="Timestamp" fc="ST"/>
  </DOType>
  <DOType id="INS_T" cdc="INS">
   <DA name="stVal" bType="INT32" fc="ST" dchg="true"/><DA name="q" bType="Quality" fc="ST" qchg="true"/><DA name="t" bType="Timestamp" fc="ST"/>
  </DOType>
  <DOType id="ACT_T" cdc="ACT">
   <DA name="general" bType="BOOLEAN" fc="ST" dchg="true"/><DA name="phsA" bType="BOOLEAN" fc="ST" dchg="true"/><DA name="phsB" bType="BOOLEAN" fc="ST" dchg="true"/><DA name="phsC" bType="BOOLEAN" fc="ST" dchg="true"/>
   <DA name="q" bType="Quality" fc="ST" qchg="true"/><DA name="t" bType="Timestamp" fc="ST"/>
  </DOType>
  <DOType id="ACD_T" cdc="ACD">
   <DA name="general" bType="BOOLEAN" fc="ST" dchg="true"/><DA name="dirGeneral" bType="Enum" type="FaultDirectionKind" fc="ST" dchg="true"/>
   <DA name="q" bType="Quality" fc="ST" qchg="true"/><DA name="t" bType="Timestamp" fc="ST"/>
  </DOType>
  <DOType id="ASG_T" cdc="ASG">
   <DA name="setMag" bType="Struct" type="AnalogueValue_f" fc="SP"/><DA name="units" bType="Struct" type="Unit_T" fc="CF"/>
  </DOType>
  <DOType id="MV_T" cdc="MV">
   <DA name="mag" bType="Struct" type="AnalogueValue_f" fc="MX" dchg="true"/><DA name="q" bType="Quality" fc="MX" qchg="true"/><DA name="t" bType="Timestamp" fc="MX"/>
   <DA name="units" bType="Struct" type="Unit_T" fc="CF"/><DA name="db" bType="INT32U" fc="CF"><Val>1000</Val></DA>
  </DOType>
  <DOType id="CMV_T" cdc="CMV">
   <DA name="cVal" bType="Struct" type="Vector_T" fc="MX" dchg="true"/><DA name="q" bType="Quality" fc="MX" qchg="true"/><DA name="t" bType="Timestamp" fc="MX"/>
  </DOType>
  <DOType id="WYE_T" cdc="WYE">
   <SDO name="phsA" type="CMV_T"/><SDO name="phsB" type="CMV_T"/><SDO name="phsC" type="CMV_T"/>
  </DOType>
  <DOType id="DPC_T" cdc="DPC">
   <DA name="stVal" bType="Dbpos" fc="ST" dchg="true"/><DA name="q" bType="Quality" fc="ST" qchg="true"/><DA name="t" bType="Timestamp" fc="ST"/>
   <DA name="Oper" bType="Struct" type="DPCOperate_T" fc="CO"/>
   <DA name="ctlModel" bType="Enum" type="CtlModelKind" fc="CF"><Val>direct-with-normal-security</Val></DA>
  </DOType>
  <DOType id="SPC_Spare" cdc="SPC">
   <DA name="stVal" bType="BOOLEAN" fc="ST" dchg="true"/><DA name="q" bType="Quality" fc="ST"/><DA name="t" bType="Timestamp" fc="ST"/>
  </DOType>
  <DAType id="AnalogueValue_f"><BDA name="f" bType="FLOAT32"/></DAType>

  <DAType id="Unit_T"><BDA name="SIUnit" bType="Enum" type="SIUnitKind"/><BDA name="multiplier" bType="Enum" type="MultiplierKind"/></DAType>
  <DAType id="Originator_T"><BDA name="orCat" bType="Enum" type="OriginatorCategoryKind"/><BDA name="orIdent" bType="Octet64"/></DAType>
  <DAType id="DPCOperate_T">
   <BDA name="ctlVal" bType="BOOLEAN"/><BDA name="origin" bType="Struct" type="Originator_T"/><BDA name="ctlNum" bType="INT8U"/><BDA name="T" bType="Timestamp"/><BDA name="Test" bType="BOOLEAN"/><BDA name="Check" bType="Check"/>
  </DAType>
  <EnumType id="BehaviourModeKind"><EnumVal ord="1">on</EnumVal><EnumVal ord="2">on-blocked</EnumVal><EnumVal ord="3">test</EnumVal><EnumVal ord="4">test/blocked</EnumVal><EnumVal ord="5">off</EnumVal></EnumType>
  <EnumType id="HealthKind"><EnumVal ord="1">Ok</EnumVal><EnumVal ord="2">Warning</EnumVal><EnumVal ord="3">Alarm</EnumVal></EnumType>
  <EnumType id="CtlModelKind"><EnumVal ord="0">status-only</EnumVal><EnumVal ord="1">direct-with-normal-security</EnumVal><EnumVal ord="2">sbo-with-normal-security</EnumVal><EnumVal ord="3">direct-with-enhanced-security</EnumVal><EnumVal ord="4">sbo-with-enhanced-security</EnumVal></EnumType>
  <EnumType id="FaultDirectionKind"><EnumVal ord="0">unknown</EnumVal><EnumVal ord="1">forward</EnumVal><EnumVal ord="2">backward</EnumVal><EnumVal ord="3">both</EnumVal></EnumType>
  <EnumType id="SIUnitKind"><EnumVal ord="1"></EnumVal><EnumVal ord="4">s</EnumVal><EnumVal ord="5">A</EnumVal><EnumVal ord="29">V</EnumVal><EnumVal ord="33">Hz</EnumVal><EnumVal ord="38">W</EnumVal><EnumVal ord="63">VA</EnumVal><EnumVal ord="64">Watts</EnumVal></EnumType>
  <EnumType id="MultiplierKind"><EnumVal ord="-3">m</EnumVal><EnumVal ord="0"></EnumVal><EnumVal ord="3">k</EnumVal><EnumVal ord="6">M</EnumVal></EnumType>
  <EnumType id="OriginatorCategoryKind"><EnumVal ord="0">not-supported</EnumVal><EnumVal ord="1">bay-control</EnumVal><EnumVal ord="2">station-control</EnumVal><EnumVal ord="3">remote-control</EnumVal><EnumVal ord="4">automatic-bay</EnumVal><EnumVal ord="5">automatic-station</EnumVal><EnumVal ord="6">automatic-remote</EnumVal><EnumVal ord="7">maintenance</EnumVal><EnumVal ord="8">process</EnumVal></EnumType>
 </DataTypeTemplates>

</script>

<script>
/* ================= SCL Studio help library ================= */
(function(){
const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const X=s=>'<pre class="ex">'+e(s.trim()).replace(/(&lt;\/?)([\w:.-]+)/g,'$1<span class="x-t">$2</span>').replace(/([\w:.-]+)="([^"]*)"/g,'<span class="x-a">$1</span>="<span class="x-v">$2</span>"')+'</pre>';
const T=(head,rows)=>'<div class="tbl"><table><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i===0?' class="mono"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>';
const STD=h=>'<div class="call std"><b>What IEC 61850 says</b>'+h+'</div>';
const WHY=h=>'<div class="call why"><b>Why it matters</b>'+h+'</div>';
const APP=h=>'<div class="call app"><b>How SCL Studio handles it</b>'+h+'</div>';
const TIP=h=>'<div class="call tip"><b>Field tip</b>'+h+'</div>';
const H=[];const add=(id,group,title,body,keys)=>H.push({id,group,title,body,keys:keys||''});

/* ---------- Getting started ---------- */
add('what-is-scl','Getting started','What SCL is and why it exists',`
<p>SCL (System Configuration description Language) is the XML file format defined in <b>IEC 61850-6</b>. It describes, in one vendor-neutral language, everything about a substation automation system: the primary equipment, the IEDs, their data models, the network, and who sends what to whom.</p>
${STD('<p>Part 6 defines the XML schema and the engineering process. Every IEC 61850 engineering tool must read and write SCL so that a relay from one vendor can be configured together with a gateway from another without re-typing anything.</p>')}
<p>The engineering flow always runs in the same direction:</p>
<div class="flowline"><span>IED vendor<br><b>ICD</b> capabilities</span><i>→</i><span>System tool<br><b>SCD</b> whole station</span><i>→</i><span>IED tool<br><b>CID</b> one device</span><i>→</i><span>Relay<br>download</span></div>
${WHY('<p>Most commissioning problems (GOOSE not received, reports missing, wrong IP) come from an SCD that does not match what was loaded into the relay. If you understand the SCD, you understand the system.</p>')}
${APP('<p>SCL Studio opens any SCL file, shows it the way an engineer thinks (station, network, IEDs, data flow), checks it against the rules of Part 6, and lets you edit it with full undo.</p>')}`,'scl xml 61850-6 engineering process');

add('file-types','Getting started','File types: SSD, ICD, IID, SCD, CID, SED',`
<p>All SCL files share the same schema. The extension tells you <i>which stage</i> of engineering the file belongs to.</p>
${T(['Type','Full name','Made by','Contains'],[
['SSD','System Specification Description','Specifier / system tool','Single-line diagram and required functions (Substation section). No real IEDs yet.'],
['ICD','IED Capability Description','IED vendor tool','What one IED type <i>can</i> do: data model, services, default data types. IED name is usually <span class="mono">TEMPLATE</span>.'],
['IID','Instantiated IED Description','IED tool (Ed.2)','One configured IED, ready to be imported into the system tool.'],
['SCD','Substation Configuration Description','System integrator','The whole station: all IEDs, communication, data flow. This is the master file.'],
['CID','Configured IED Description','IED tool','One IED extracted from the SCD, as downloaded to the device.'],
['SED','System Exchange Description','System tool (Ed.2)','Data exchanged between two projects, for example two substations sharing a line.']])}
${TIP('<p>Treat the SCD as the single source of truth. When a vendor tool changes an IED, re-import its IID/CID into the SCD so they stay identical.</p>')}
${APP('<p>The file type badge in the top bar is taken from the extension. If the extension is unusual, SCL Studio works it out from the content (number of IEDs, presence of Substation and Communication).</p>')}`,'ssd icd iid scd cid sed extension');

add('editions','Getting started','Editions: 2003, 2007B, 2007B4',`
<p>The root element carries the edition in <span class="mono">version</span>, <span class="mono">revision</span> and <span class="mono">release</span>.</p>
${T(['Root attributes','Edition','Notes'],[
['no version / 2003','Edition 1','Original 2004 schema. No srcCBName on ExtRef, no IID/SED.'],
['version="2007" revision="A"','Edition 2','Adds IID and SED, control block references on ExtRef, OR functional constraint, new LN groups (F, K, Q).'],
['version="2007" revision="B" release="4"','Edition 2.1','Clarifications, later binding (pDO, pLN, pServT on ExtRef), ValKind / valImport, maintenance amendments.']])}
${WHY('<p>A relay that only understands Edition 1 may reject a CID with Edition 2 attributes. Always check what edition each IED supports before mixing them in one SCD.</p>')}
${X('<SCL xmlns="http://www.iec.ch/61850/2003/SCL" version="2007" revision="B" release="4">')}`,'edition version revision release ed1 ed2 ed2.1');

add('workflow','Getting started','Building an SCD step by step',`
<ol class="steps">
<li><b>Start</b> with <i>New SCD</i>, or open an SSD from the specifier.</li>
<li><b>Import ICD/IID files</b> (IEDs view → Import). Each IED gets a unique name; data types are merged automatically.</li>
<li><b>Rename IEDs</b> to your naming convention, for example <span class="mono">P132_Q01</span> = 132 kV protection, bay Q01. References follow automatically.</li>
<li><b>Connect access points</b> to the station bus (Communication view) and set IP addresses.</li>
<li><b>Create data sets and control blocks</b> (Explorer → LN0 → Add child) for GOOSE, SV and reports.</li>
<li><b>Assign multicast addresses</b> (Communication → Auto-assign MAC/APPID).</li>
<li><b>Bind subscriptions</b>: add ExtRef elements under the subscriber's Inputs.</li>
<li><b>Validate</b> until there are no errors.</li>
<li><b>Export</b> the SCD, then <b>Export as CID</b> for each IED to load into its vendor tool.</li></ol>`,'workflow steps how to build');

/* ---------- File structure ---------- */
add('header','File structure','Header and revision history',`
${STD('<p>Every SCL file starts with <span class="mono">Header</span>. It identifies the project and records changes.</p>')}
${T(['Field','Meaning','Example'],[
['id','Project identifier. Must be present.','S13_132-33kV'],
['version / revision','Version of <i>this file</i>, not of the standard. Raise it whenever you hand the file to someone.','1.2 / A'],
['toolID','Tool that last wrote the file.','SCL Studio'],
['nameStructure','How object names are formed. Only <span class="mono">IEDName</span> is used in practice.','IEDName'],
['Hitem when/who/what/why','One line of change history.','2026-10-02, Engineering, Added intertrip GOOSE, SAT findings']])}
${WHY('<p>During SAT and later maintenance, the history is the only record of why a GOOSE or IP changed. Auditors and future engineers rely on it.</p>')}
${APP('<p>Overview → Revision history shows every entry and lets you add one with today\'s date.</p>')}
${X('<Header id="S13" version="1.2" revision="A" toolID="SCL Studio" nameStructure="IEDName">\n  <History>\n    <Hitem version="1.2" revision="A" when="2026-10-02" who="Engineering" what="Added T1 intertrip GOOSE" why="SAT"/>\n  </History>\n</Header>')}`,'header history hitem id version revision toolid namestructure');

add('substation','File structure','Substation section and single-line diagram',`
<p>The <span class="mono">Substation</span> section models primary equipment in a fixed hierarchy:</p>
<div class="flowline"><span>Substation</span><i>›</i><span>VoltageLevel</span><i>›</i><span>Bay</span><i>›</i><span>ConductingEquipment</span></div>
${T(['Element','Meaning','Example'],[
['VoltageLevel','A busbar system at one voltage. <span class="mono">Voltage</span> child gives the value.','E1, 132 kV'],
['Bay','One feeder, incomer or coupler.','Q01 Line feeder'],
['ConductingEquipment','A primary device. <span class="mono">type</span> is a fixed 3-letter code.','QA1, CBR'],
['PowerTransformer / TransformerWinding','Transformer and its windings (type PTR / PTW).','T1 132/33 kV'],
['LNode','Binds a logical node in an IED to this equipment.','P132_Q01 CTRL/XCBR1 on QA1'],
['ConnectivityNode / Terminal','Electrical connection points (topology).','CN1']])}
<h4>Equipment type codes</h4>
${T(['Code','Equipment'],[['CBR','Circuit breaker'],['DIS','Disconnector or earth switch'],['CTR','Current transformer'],['VTR','Voltage transformer'],['PTR','Power transformer'],['CAP','Capacitor bank'],['REA','Reactor'],['GEN','Generator'],['MOT','Motor'],['CAB / LIN','Cable / overhead line'],['SAR','Surge arrester'],['BAT','Battery'],['IFL','Infeeding line'],['EFN','Earth fault neutraliser (Petersen coil)']])}
${WHY('<p>LNode bindings tell every tool (and every engineer) <i>which breaker XCBR1 actually trips</i>. Without them the SCD is just a list of relays.</p>')}
${APP('<p>The Substation view draws a single-line diagram per voltage level. Click any symbol to edit it. The LN bindings table shows which bindings resolve to a real logical node.</p>')}`,'substation voltagelevel bay conductingequipment cbr dis ctr vtr ptr lnode single line sld');

add('ied','File structure','IED, access point, server, logical device',`
<p>An IED is described in layers. Each layer has a job:</p>
${T(['Element','Job','Example'],[
['IED','The physical device. <span class="mono">name</span> must be unique in the SCD (letter first, max 64 chars).','P132_Q01'],
['Services','What the device supports: how many data sets, GOOSE, reports, dynamic changes.','GOOSE max="8"'],
['AccessPoint','A communication port of the IED (station bus, process bus).','S1'],
['Server','The MMS server behind the access point.',''],
['LDevice','Logical device: a group of functions, for example protection or control.','PROT, CTRL'],
['LN0 / LN','Logical nodes: individual functions. LN0 (LLN0) holds data sets and control blocks.','PTRC1, XCBR1']])}
<h4>Object references</h4>
<p>Every signal has a unique name built from these layers:</p>
<div class="ref"><span class="r1">P132_Q01</span><span class="r2">PROT</span>/<span class="r3">PTRC1</span>.<span class="r4">Tr</span>.<span class="r5">general</span></div>
<p class="muted">IED name + LD inst = logical device name · prefix + LN class + inst = logical node · data object · data attribute</p>
${WHY('<p>The SCADA point list, GOOSE mapping and disturbance records all use these references. A typo in an IED or LD name breaks every link to it.</p>')}
${APP('<p>Rename in the IEDs view updates ConnectedAP, ExtRef, ClientLN, LNode, IEDName and the GoID/rptID prefixes in one step, so nothing is left pointing at the old name.</p>')}`,'ied name accesspoint server ldevice ln0 ln object reference manufacturer configversion');

add('services','File structure','Services: what the IED can do',`
<p><span class="mono">Services</span> lists the IED's capabilities. The system tool must not ask for more than the IED offers.</p>
${T(['Element','Meaning'],[
['ConfDataSet max / maxAttributes','How many data sets can be configured, and the most members one data set can have.'],
['GOOSE max','How many GOOSE control blocks the IED can publish.'],
['ConfReportControl max','How many report control blocks can be configured.'],
['ReportSettings / GSESettings','Which control block attributes are fixed (Fix), configurable offline (Conf) or changeable online (Dyn).'],
['DynAssociation, GetDirectory, ReadWrite …','Basic MMS services supported.'],
['ConfLNs fixPrefix / fixLnInst','Whether LN prefixes and instance numbers are fixed by the vendor.']])}
${WHY('<p>If an SCD has 10 GOOSE control blocks for an IED that supports 8, the vendor tool will refuse the CID or silently drop some.</p>')}
${APP('<p>Validation compares data set count, data set size, GOOSE count and report count against these limits (rule <i>Services</i>).</p>')}`,'services confdataset maxattributes goose max confreportcontrol reportsettings gsesettings');

add('ln-classes','Data model','Logical node classes',`
<p>The LN class (4 letters, from <b>IEC 61850-7-4</b>) says what a function is. The first letter is the group:</p>
${T(['Letter','Group','Common classes'],[
['L','System','LLN0 (logical device itself), LPHD (physical device)'],
['P','Protection','PTOC overcurrent, PDIS distance, PDIF differential, PTRC trip conditioning, PTOV overvoltage'],
['R','Protection-related','RREC auto-reclose, RBRF breaker failure, RSYN synchrocheck, RDRE disturbance recorder'],
['C','Control','CSWI switch controller, CILO interlocking, CPOW point-on-wave'],
['X','Switchgear','XCBR circuit breaker, XSWI disconnector'],
['M','Measurement','MMXU 3-phase measurement, MMTR metering, MSQI sequence'],
['G','Generic','GGIO generic I/O, GAPC generic automatic'],
['A','Automatic control','ATCC tap changer control, AVCO voltage control'],
['Y','Power transformer','YPTR transformer, YLTC tap changer'],
['T','Instrument transformers','TCTR current, TVTR voltage (process bus)'],
['S','Supervision','SIML insulation liquid (DGA), SIMG gas monitoring, SCBR breaker supervision'],
['I','Interfacing','ITCI telecontrol interface, IHMI HMI, IARC archive'],
['Q, K, F','Ed.2 groups','Power quality, mechanical, function blocks']])}
${TIP('<p>Use the specific class whenever one exists. A trip mapped to GGIO works, but nobody can tell what it means without the vendor manual. PTRC.Tr is self-explaining.</p>')}`,'ln class lnclass lln0 lphd ptoc pdis pdif ptrc xcbr cswi mmxu ggio 7-4 prefix inst');

add('data-model','Data model','Data objects, attributes and instance values',`
<p>Inside a logical node, information is nested in three levels:</p>
${T(['Level','Defined by','Example','Meaning'],[
['Data object (DO)','LNodeType → DO','Pos','Breaker position'],
['Common data class (CDC)','DOType cdc','DPC','Controllable double point'],
['Data attribute (DA)','DOType → DA','stVal, q, t, ctlModel','The value, its quality, its timestamp, its configuration']])}
<p>Sub data objects (SDO) and struct components (BDA) add more levels, for example <span class="mono">A.phsA.cVal.mag.f</span>: current, phase A, complex value, magnitude, float.</p>
<h4>Template value vs instance value</h4>
<p>A default value can be written in the data type (<span class="mono">DA/Val</span>) and overridden for one specific LN with <span class="mono">DOI/DAI/Val</span>.</p>
${X('<LN lnClass="CSWI" inst="1" lnType="CSWI_T">\n  <DOI name="Pos">\n    <DAI name="ctlModel"><Val>sbo-with-enhanced-security</Val></DAI>\n  </DOI>\n</LN>')}
${APP('<p>In the IEDs view, each data object expands into its attributes with FC, type and value. A value marked <span class="chip acc">inst</span> comes from the instance (DAI). Others come from the type. Changing a value always writes a DAI, so the shared type stays untouched for other LNs.</p>')}`,'do da sdo bda doi sdi dai val instance value cdc');

add('fc','Data model','Functional constraints (FC)',`
<p>The FC groups attributes by purpose. Data sets, reports and access rights all work per FC.</p>
${T(['FC','Name','Typical attributes','Use'],[
['ST','Status','stVal, q, t, general','Events, positions, trips. Use in GOOSE and event reports.'],
['MX','Measurand','mag, cVal, q, t','Analog measurements. Use in measurement reports.'],
['CO','Control','Oper, SBOw, Cancel','Commands. Never put in a data set.'],
['SP','Setting (outside groups)','setVal, setMag','Single settings.'],
['SG / SE','Setting group / editable group','setMag','Settings that change with the active group.'],
['CF','Configuration','ctlModel, units, db, sboTimeout','How the object behaves. Usually fixed in the SCD.'],
['DC','Description','d, vendor, swRev','Text descriptions and nameplates.'],
['SV','Substitution','subEna, subVal','Manual override of a value for testing.'],
['BL','Blocking','blkEna','Blocks updates of a value.'],
['EX','Extended definition','dataNs, cdcNs','Namespace information.'],
['OR','Operate received (Ed.2)','opRcvd, opOk','Diagnostic of received commands.']])}
${TIP('<p>A data set entry with FC=MX but a DA that is ST (or the reverse) is invalid. SCL Studio reports this as an FCDA error.</p>')}`,'fc functional constraint st mx co sp sg se cf dc sv bl ex or');

add('cdc','Data model','Common data classes (CDC)',`
<p>The CDC (from <b>IEC 61850-7-3</b>) fixes which attributes a data object has.</p>
${T(['CDC','Meaning','Key attributes','Example DO'],[
['SPS','Single point status','stVal BOOLEAN','Loc, Proxy'],
['DPS','Double point status','stVal Dbpos','Pos (status only)'],
['INS / ENS','Integer / enumerated status','stVal','OpCnt, Beh, Health'],
['ACT','Protection activation','general, phsA/B/C','Op, Tr'],
['ACD','Activation with direction','general, dirGeneral','Str (start / pickup)'],
['MV','Measured value','mag.f, units, db','TotW, Hz'],
['CMV','Complex measured value','cVal.mag.f, cVal.ang.f','one phase of a WYE'],
['WYE / DEL','Phase-to-ground / phase-to-phase set','phsA, phsB, phsC / phsAB…','A, PhV / PPV'],
['SPC / DPC','Controllable single / double point','stVal, Oper, ctlModel','Pos of XCBR/CSWI'],
['INC / ENC','Controllable integer / enum','stVal, Oper, ctlModel','Mod'],
['ASG / ING','Analogue / integer setting','setMag / setVal','PoRch, OpDlTmms'],
['LPL / DPL','Logical / device nameplate','vendor, swRev, configRev','NamPlt, PhyNam']])}`,'cdc 7-3 sps dps ins ens act acd mv cmv wye del spc dpc inc enc asg ing lpl dpl');

add('btypes','Data model','Basic types (bType)',`
${T(['bType','Meaning'],[
['BOOLEAN','true / false'],
['INT8…INT64, INT8U…INT32U','Signed / unsigned integers'],
['FLOAT32 / FLOAT64','Floating point (measurements, settings)'],
['Enum','One value from an EnumType (named ordinal list)'],
['Dbpos','Double point: intermediate-state (00), off (01), on (10), bad-state (11)'],
['Quality','13-bit quality: validity (good, invalid, questionable), detail flags (overflow, oldData, failure …), source (process / substituted), test, operatorBlocked'],
['Timestamp','UTC seconds, fraction, and time quality (leap second, clock failure, not synchronised, accuracy)'],
['Struct','Composite, defined by a DAType'],
['VisString32…255, Unicode255','Text'],
['Octet64','Binary string, for example orIdent'],
['Check','Interlock and synchrocheck flags in commands']])}
${WHY('<p>Every GOOSE should carry the <span class="mono">q</span> attribute next to the value. A subscriber that only reads <span class="mono">stVal</span> cannot tell a real trip from a value sent while the publisher is in test mode.</p>')}`,'btype basic type boolean int float enum dbpos quality timestamp struct visstring');

add('ctlmodel','Data model','Control model (ctlModel) and Mod/Beh',`
<p><span class="mono">ctlModel</span> (FC=CF) decides how a command to a controllable object is executed:</p>
${T(['Value','Name','Sequence'],[
['0','status-only','Not controllable. Only the status is reported.'],
['1','direct-with-normal-security','Operate is executed immediately.'],
['2','sbo-with-normal-security','Select, then Operate within sboTimeout.'],
['3','direct-with-enhanced-security','Operate, then the IED sends CommandTermination when the breaker actually reaches the position.'],
['4','sbo-with-enhanced-security','Select with value, Operate, then CommandTermination. Standard choice for breakers and disconnectors.']])}
${WHY('<p>The SCADA or HMI must use the same model. If the IED expects SBO and the gateway sends a direct Operate, the command is rejected with <i>Object-not-selected</i>.</p>')}
<h4>Mod, Beh and Health</h4>
${T(['DO','Meaning','Values'],[
['Mod','Mode you set (controllable)','on, on-blocked, test, test/blocked, off'],
['Beh','Behaviour the function actually has, combining its own Mod with the LD mode','same values'],
['Health','Self-supervision result','Ok, Warning, Alarm']])}
${TIP('<p>In <i>test</i> behaviour, GOOSE messages carry the test flag. Subscribers in normal mode ignore them, so test mode is the safe way to test a relay in a live station.</p>')}`,'ctlmodel sbo enhanced security direct status-only select operate mod beh health test');

add('templates','Data model','Data type templates',`
<p><span class="mono">DataTypeTemplates</span> holds reusable type definitions. Logical nodes refer to them by <span class="mono">id</span>.</p>
${T(['Element','Defines','Referenced by'],[
['LNodeType','Which DOs a logical node has','LN lnType'],
['DOType','Which DAs / SDOs a data object has, and its CDC','DO type, SDO type'],
['DAType','Components of a struct attribute','DA/BDA type when bType=Struct'],
['EnumType','Allowed values of an enumeration','DA/BDA type when bType=Enum']])}
${WHY('<p>Two vendors may both call a type <span class="mono">MV_1</span> with different content. Merging ICDs carelessly can silently change one IED\'s data model.</p>')}
${APP('<p>On import, identical types are shared. A type with the same id but different content is renamed (for example <span class="mono">MV_1_P87T_T1</span>) and every reference in the imported IED is updated. The Data types view shows where each type is used, and <i>Remove unused</i> cleans types no IED refers to.</p>')}`,'datatypetemplates lnodetype dotype datype enumtype id type template merge unused');

/* ---------- Data exchange ---------- */
add('dataset','Data exchange','Data sets and FCDA',`
${STD('<p>A <span class="mono">DataSet</span> is an ordered list of signals that are sent together by a GOOSE, SV, report or log. It lives in a logical node (GOOSE and SV data sets must be in LLN0).</p>')}
${T(['FCDA attribute','Meaning','Example'],[
['ldInst','Logical device of the signal','PROT'],
['prefix, lnClass, lnInst','Logical node','PTRC, 1'],
['doName','Data object (dot for SDO)','Tr or A.phsA'],
['daName','Data attribute. If empty, all attributes with this FC are included (FCD).','general'],
['fc','Functional constraint','ST']])}
${X('<DataSet name="DS_TRIP">\n  <FCDA ldInst="PROT" lnClass="PTRC" lnInst="1" doName="Tr" daName="general" fc="ST"/>\n  <FCDA ldInst="PROT" lnClass="PTRC" lnInst="1" doName="Tr" daName="q" fc="ST"/>\n</DataSet>')}
${WHY('<p>The <b>order</b> of members is part of the configuration. Subscribers decode GOOSE by position, so changing the order without raising confRev breaks every subscriber.</p>')}
${TIP('<p>For GOOSE, list single attributes (value + q) rather than whole data objects. Messages stay small and subscribers map them easily. For reports, whole data objects (FCD) are fine.</p>')}
${APP('<p>Every FCDA is resolved down to the data type. Validation reports members whose LN, DO or DA does not exist, a wrong FC, and data sets larger than <span class="mono">maxAttributes</span>.</p>')}`,'dataset fcda fcd ldinst lninst doname daname fc members order');

add('goose','Data exchange','GOOSE control blocks and timing',`
${STD('<p>GOOSE (<b>IEC 61850-8-1</b>) is a multicast Ethernet message (layer 2, no IP) used for fast peer-to-peer signals such as trips, interlocks and breaker failure. It is published by a <span class="mono">GSEControl</span> in LLN0.</p>')}
${T(['GSEControl attribute','Meaning','Example'],[
['name','Control block name, unique in LLN0','GCB_TRIP'],
['datSet','Data set that is sent','DS_TRIP'],
['appID','The GoID: text identifier of the stream that subscribers check','P132_Q01PROT/LLN0.GCB_TRIP'],
['confRev','Configuration revision. Must increase when the data set changes.','1'],
['type','GOOSE (GSSE is obsolete)','GOOSE'],
['fixedOffs','Fixed-length encoding (Ed.2), for hardware decoders','false'],
['IEDName child','Intended subscribers, informational','P87T_T1']])}
<h4>How retransmission works</h4>
<p>On a change, the IED sends the message immediately, then repeats it at increasing intervals starting at <b>MinTime</b> until it reaches <b>MaxTime</b>. It then repeats every MaxTime as a heartbeat. Each message tells the subscriber how long to wait (Time Allowed To Live) before declaring the stream lost.</p>
<div class="burst" aria-label="GOOSE retransmission"><i style="left:2%"></i><i style="left:5%"></i><i style="left:9%"></i><i style="left:17%"></i><i style="left:33%"></i><i style="left:58%"></i><i style="left:83%"></i><span style="left:0">event</span><span style="left:14%">MinTime</span><span style="left:62%">… MaxTime heartbeat</span></div>
${T(['Communication (GSE) field','Meaning','Typical'],[
['MAC-Address','Destination multicast address. Range 01-0C-CD-01-00-00 to 01-0C-CD-01-01-FF.','01-0C-CD-01-00-11'],
['APPID','4 hex digits, 0000–3FFF for GOOSE. Unique per stream so switches and IEDs can filter.','0011'],
['VLAN-ID','3 hex digits. 000 = priority-tagged only.','00A'],
['VLAN-PRIORITY','0–7. 4 is the default for GOOSE; use higher for trips.','4'],
['MinTime','First retransmission delay in ms','4'],
['MaxTime','Heartbeat interval in ms','1000']])}
${WHY('<p>A subscriber accepts a GOOSE only if MAC, APPID, GoID, data set reference and confRev all match its configuration. Any mismatch means the trip is silently not received. That is why these fields must be unique and consistent.</p>')}
${APP('<p>Communication view lets you edit all GSE fields in place and highlights duplicates. <i>Auto-assign MAC/APPID</i> numbers every stream uniquely within the correct ranges and creates missing GSE entries with priority 4, MinTime 4 ms and MaxTime 1000 ms.</p>')}`,'goose gsecontrol gse appid goid mac address vlan priority mintime maxtime confrev fixedoffs retransmission tal');

add('sv','Data exchange','Sampled values (SV)',`
${STD('<p>Sampled values (<b>IEC 61850-9-2</b>) carry digitised currents and voltages from merging units on the process bus. They are published by a <span class="mono">SampledValueControl</span> and addressed by an <span class="mono">SMV</span> element.</p>')}
${T(['Field','Meaning','Typical (9-2LE)'],[
['smvID','Stream identifier checked by subscribers','MU01/LLN0.MSVCB01'],
['smpRate','Samples per nominal cycle (or per second, depending on smpMod)','80 protection, 256 metering'],
['nofASDU','Samples packed in one Ethernet frame','1 for 80, 8 for 256'],
['multicast','Multicast or unicast','true'],
['SmvOpts','Optional fields: refreshTime, sampleSynchronized, sampleRate, security, dataRef',''],
['MAC-Address','01-0C-CD-04-00-00 to 01-0C-CD-04-01-FF','01-0C-CD-04-00-01'],
['APPID','4000–7FFF','4001']])}
${WHY('<p>One SV stream at 80 samples/cycle is about 4,000 frames per second. Wrong VLAN or a duplicate APPID can flood a station bus that was never designed for it.</p>')}`,'sv sampled values smv sampledvaluecontrol smvid smprate nofasdu 9-2 9-2le merging unit');

add('reports','Data exchange','Report control blocks (BRCB / URCB)',`
${STD('<p>Reports send data sets to a client (SCADA gateway, HMI) over MMS when something changes. A <span class="mono">ReportControl</span> defines when and how.</p>')}
${T(['Attribute','Meaning','Example'],[
['name','RCB name','brcbEvents'],
['buffered','true = BRCB: events are stored in the IED during a communication loss and sent afterwards. false = URCB: no storage.','true for events, false for measurements'],
['rptID','Identifier the client sees. Empty means the RCB object reference.','P132_Q01PROT/LLN0$BR$brcbEvents'],
['datSet','Data set to report','DS_EVT'],
['confRev','Raise when the data set changes','1'],
['bufTime','ms to wait and collect more changes into one report','50'],
['intgPd','Integrity period in ms: whole data set is sent this often if <i>period</i> is enabled','5000'],
['RptEnabled max','How many clients can use this RCB (instances)','4'],
['ClientLN','Which client is meant to use it','GW1 LD0/ITCI1']])}
<h4>Trigger options (TrgOps)</h4>
${T(['Option','A report is sent when…'],[['dchg','a data value changes'],['qchg','a quality changes'],['dupd','a value is updated, even if equal (freeze values, counters)'],['period','the integrity period expires'],['gi','the client asks for a general interrogation']])}
<h4>Optional fields (OptFields)</h4>
${T(['Option','Adds to the report'],[['seqNum','Sequence number, to detect lost reports'],['timeStamp','Time the report was created'],['dataSet','Data set name'],['reasonCode','Why each value was included (dchg, gi …)'],['dataRef','Full reference of each value'],['entryID','Buffer position, lets the client resume after reconnect (BRCB)'],['configRef','confRev, detects configuration mismatch'],['bufOvfl','Buffer overflow flag (BRCB)']])}
${TIP('<p>Use BRCB with dchg+qchg+gi for alarms and positions, and URCB with dchg+period for measurements. Enable seqNum, timeStamp, reasonCode and entryID so the gateway can prove nothing was lost.</p>')}`,'report reportcontrol brcb urcb buffered rptid buftime intgpd trgops optfields dchg qchg dupd period gi rptenabled clientln seqnum entryid');

add('log','Data exchange','Log control blocks',`
<p>A <span class="mono">LogControl</span> writes a data set into the IED's internal log (sequence of events stored in the device). <span class="mono">logName</span> names the log, <span class="mono">logEna</span> enables it, TrgOps define what is recorded.</p>
${WHY('<p>Logs survive loss of SCADA communication and are the first place to look after an incident when the station log is incomplete.</p>')}`,'log logcontrol logname logena sequence of events');

add('extref','Data exchange','Subscriptions: Inputs and ExtRef',`
${STD('<p>A subscriber declares what it receives with <span class="mono">Inputs/ExtRef</span> inside one of its logical nodes. Each ExtRef points at one signal in another IED.</p>')}
${T(['Attribute','Meaning','Example'],[
['iedName, ldInst, prefix, lnClass, lnInst, doName, daName','The source signal','P87T_T1 PROT/PDIF1.Op.general'],
['serviceType','How it arrives','GOOSE, SMV, Report, Poll'],
['srcLDInst, srcPrefix, srcLNClass, srcLNInst, srcCBName','The source control block (Ed.2)','PROT LLN0 GCB_DIFF'],
['intAddr','The internal input it drives in the subscriber (vendor-specific)','BI_INTERTRIP_T1'],
['pDO, pLN, pDA, pServT','Later binding (Ed.2.1): expected type of signal, filled before the source is known','']])}
${X('<LN lnClass="PTRC" inst="1" lnType="PTRC_T">\n  <Inputs>\n    <ExtRef iedName="P87T_T1" ldInst="PROT" lnClass="PDIF" lnInst="1"\n            doName="Op" daName="general" serviceType="GOOSE"\n            srcLDInst="PROT" srcLNClass="LLN0" srcCBName="GCB_DIFF"\n            intAddr="BI_INTERTRIP_T1"/>\n  </Inputs>\n</LN>')}
<p class="muted">Read it as: "P132_Q01's trip logic PTRC1 receives the differential operate signal of P87T_T1 over GOOSE GCB_DIFF and connects it to internal input BI_INTERTRIP_T1."</p>
${APP('<p>Validation checks that the source IED, LN and DO exist, that srcCBName exists, and that the signal is actually a member of that control block\'s data set. The Data flow matrix is built from these ExtRefs.</p>')}`,'extref inputs subscription subscriber intaddr srccbname servicetype later binding pdo pln');

add('confrev','Data exchange','confRev: configuration revision',`
<p><span class="mono">confRev</span> is a number on every GOOSE, SV and report control block. The IED sends it in every message, and subscribers compare it with what they were configured for.</p>
${WHY('<p>If you add, remove or reorder a data set member and do not raise confRev, subscribers decode the wrong values in the wrong positions. If you raise it but do not update the subscribers, they reject the messages. In both cases the signal is lost, so confRev and the subscriber CIDs must always change together.</p>')}
${TIP('<p>After changing a data set: raise confRev, export CIDs for the publisher <b>and every subscriber</b>, and retest the affected signals.</p>')}`,'confrev configuration revision mismatch');

/* ---------- Communication ---------- */
add('subnetwork','Communication','Subnetworks and connected access points',`
${T(['Element','Meaning','Example'],[
['SubNetwork name / type','A network segment. Type 8-MMS = station bus (IEC 61850-8-1); 9-2 for process bus.','StationBus, 8-MMS'],
['BitRate','Nominal speed','100 Mb/s'],
['ConnectedAP iedName / apName','Says that this IED access point is plugged into this subnetwork','P132_Q01 · S1'],
['Address / P','Addressing parameters of that access point','IP 10.13.1.11'],
['GSE / SMV','Multicast addresses of GOOSE / SV published from this access point','']])}
${WHY('<p>An IED without a ConnectedAP cannot be reached by any client, and its GOOSE has no address. The vendor tool will then use defaults, which often clash.</p>')}
${APP('<p>Communication view → <i>Connect access point</i> adds a ConnectedAP from a drop-down of every IED and access point in the file.</p>')}`,'subnetwork connectedap apname bitrate 8-mms station bus process bus');

add('mms-address','Communication','MMS addressing: IP and OSI selectors',`
${STD('<p>Client/server traffic (reports, commands, file transfer) uses MMS over TCP port 102 (ISO transport over TCP, RFC 1006). The OSI selectors identify the application above TCP.</p>')}
${T(['P type','Meaning','Typical'],[
['IP','IPv4 address of the access point','10.13.1.11'],
['IP-SUBNET','Subnet mask','255.255.255.0'],
['IP-GATEWAY','Default router (only needed for traffic leaving the subnet)','10.13.1.1'],
['OSI-AP-Title','Application process title','1,3,9999,23'],
['OSI-AE-Qualifier','Application entity qualifier','23'],
['OSI-PSEL','Presentation selector','00000001'],
['OSI-SSEL','Session selector','0001'],
['OSI-TSEL','Transport selector','0001']])}
${WHY('<p>The client (gateway, HMI) must use the same selectors as the server. Many vendors use the defaults above. A mismatch gives a TCP connection that is refused at association, which looks like "ping OK but no data".</p>')}
${APP('<p>All fields are editable in the access point table. Validation flags invalid IPs, duplicate IPs and gateways outside the subnet.</p>')}`,'ip subnet gateway osi ap-title ae-qualifier psel ssel tsel mms tcp 102 address p');

add('vlan','Communication','VLANs and priority for GOOSE and SV',`
<p>GOOSE and SV frames carry an IEEE 802.1Q tag with a VLAN ID and a priority (0–7).</p>
${T(['Setting','Effect'],[
['VLAN-ID','Switches forward the frame only to ports in this VLAN, keeping multicast traffic away from devices that do not need it.'],
['VLAN-PRIORITY','Switches queue higher priorities first. Trips and SV should be above normal traffic; 4 is the IEC default, 6 is common for trips.']])}
${TIP('<p>The VLAN IDs in the SCD only work if the Ethernet switches are configured with the same VLANs. Give the switch engineer the Communication view of the SCD.</p>')}`,'vlan vlan-id vlan-priority 802.1q switch priority');

/* ---------- Using SCL Studio ---------- */
add('view-overview','Using SCL Studio','Overview view',`<p>Project header, counts of everything in the file, validation summary, revision history and the IED inventory with manufacturer, type, configuration version and IP. Click an IED row to open it. <i>Import ICD/CID</i> adds a device to the SCD.</p>`,'overview inventory');
add('view-substation','Using SCL Studio','Substation view',`<p>Single-line diagram for each voltage level built from the Substation section. Busbar at the top, bays going down, equipment symbols drawn from their type code, LN bindings in violet next to the equipment. Click a symbol or bay name to edit it in Explorer. <i>Add bay</i> creates a bay with a disconnector, breaker and CT.</p>`,'substation view sld');
add('view-comm','Using SCL Studio','Communication view',`<p>One card per subnetwork. The access point table and the GOOSE/SV table are editable: change a cell, press Tab or Enter, and the change is recorded with undo. Red text marks invalid or duplicate values. Use <i>Auto-assign MAC/APPID</i> once all control blocks exist.</p>`,'communication view');
add('view-ieds','Using SCL Studio','IEDs view: data sets and report control blocks',`
<p>Three columns: the IEDs, a tree of the selected IED, and an editor for whatever you select in the tree.</p>
<p>The tree shows <span class="bdg b-ld">LD</span> logical devices and <span class="bdg b-ln">LN</span> logical nodes. LLN0 opens automatically, because that is where data sets and control blocks normally live. Under each logical node you find:</p>
${T(['Badge','Item','Editor shows'],[['<span class="bdg b-ds">DS</span>','Data set','Members table (LN reference, DO, DA, FC) with reorder and remove, a 4-step member picker, and which blocks use it'],['<span class="bdg b-rc">RC</span>','Report control block','Properties, trigger options, optional fields and clients, each with its meaning'],['<span class="bdg b-go">GO</span>','GOOSE control block','Properties, the network address (MAC, APPID, VLAN, MinTime, MaxTime) and subscribers'],['<span class="bdg b-sv">SV</span>','Sampled value control block','Properties, SV options, address, subscribers'],['<span class="bdg b-lg">LG</span>','Log control block','Properties and trigger options'],['<span class="bdg b-in">IN</span>','Inputs','Every ExtRef with its source and whether it resolves']])}
<p>Selecting a logical node shows buttons to add a data set, report, GOOSE, SV or log block, then the full data model with editable values.</p>
<p>Renaming a data set updates the control blocks that send it. Renaming a GOOSE or SV block updates its Communication address and every subscriber's srcCBName.</p>`,'ieds view rename export cid dataset report rcb tree');
add('view-flow','Using SCL Studio','Data flow view',`<p>The subscription matrix shows who receives what: rows are publishers, columns are subscribers, cells count GOOSE (G), SV (S) and report (R) links. The table lists every control block with its data set, ID, confRev, address and subscribers. <i>(declared)</i> means the subscriber is named in IEDName but has no ExtRef yet. Click a row for details.</p>`,'data flow matrix publisher subscriber');
add('view-templates','Using SCL Studio','Data types view',`<p>All templates grouped by kind, with the class or CDC. Unused types are faded. Selecting a type shows its structure (click a referenced type to jump to it) and every place it is used.</p>`,'data types view');
add('view-validation','Using SCL Studio','Validation rules',`
<p>Validation runs after every change. Click a finding to open the element.</p>
${T(['Rule','Checks','Severity'],[
['Header','Header and id present, history recorded','error / note'],
['IED name','Valid tIEDName, unique','error'],
['Services','Data set, GOOSE and report counts within IED limits','error'],
['LDevice / LN','LN0 present, LD name ≤ 64, no duplicate LNs','error'],
['Type reference','lnType, DO, SDO, DA, BDA types exist; lnClass matches','error'],
['Mandatory data','Beh present in each LNodeType (except LLN0/LPHD)','warning'],
['bType / FC / Enum value','Known basic types, valid FCs, default values allowed by the enum','error'],
['DOI','Instance data exists in the LN type','error'],
['DataSet / FCDA','Members resolve, FC matches, size within maxAttributes','error'],
['Control block','datSet exists, confRev present, GoID present and ≤ 129 characters','error / warning'],
['ExtRef','Source IED/LN/DO and srcCBName exist; signal is in the published data set','error / warning'],
['ConnectedAP','IED and access point exist, not connected twice','error'],
['IP address','Valid, unique, gateway inside the subnet','error / warning'],
['MAC / APPID / VLAN','Format, ranges, uniqueness','error / warning'],
['GOOSE timing','MinTime below MaxTime','warning'],
['Communication','Every GOOSE/SV has an address; every IED is connected','warning'],
['LNode','Substation bindings point to real logical nodes','warning'],
['Unused type','Templates no IED uses','note']])}`,'validation rules checks errors warnings');
add('view-explorer','Using SCL Studio','Explorer: editing any element',`<p>The complete XML tree. Select an element to edit its attributes. Fields with a fixed list of values offer suggestions as you type. <i>+ attribute</i> buttons add the attributes the standard expects. <i>Add child</i> lists only the children allowed by the schema and inserts them in the correct position. Duplicate, delete (with confirmation) and reorder are in the header. Hover over an attribute name, or click the <b>?</b> beside it, for its meaning.</p>`,'explorer edit attributes add child schema');
add('view-source','Using SCL Studio','XML source and Compare',`<p><b>XML source</b> shows the formatted file. <i>Edit source</i> lets you change the XML directly; it is checked before it is applied, and can be undone. <b>Compare</b> loads a second file and matches elements by name (not by line), listing added, removed and changed elements and attributes. Use it to see what a vendor tool changed in a returned CID.</p>`,'source compare diff');
add('view-export','Using SCL Studio','Import, export and shortcuts',`
${T(['Action','What happens'],[
['Open / drop file','Reads the file locally; nothing is uploaded'],
['Import ICD/CID','Adds the IED(s), renames on clash, merges data types, brings its ConnectedAP'],
['Export','Writes formatted UTF-8 XML; download or copy'],
['Export as CID','Writes one IED with its access points and only the data types it uses'],
['Undo / Redo','Ctrl+Z / Ctrl+Y, every change, up to 80 steps'],
['Ctrl+S / Ctrl+O','Export / Open'],
['Theme button','Switches dark and light'],
['Large files (over 12 MB)','Large file mode: long lists show the first few hundred rows with Show more and a filter box, validation runs when you ask for it after edits, and the source view shows the first 600 KB. Export always writes the full file.']])}`,'import export cid shortcuts undo redo keyboard');

    if(at(er,'srcCBName'))hit=at(er,'srcCBName')===at(cb,'name')&&(at(er,'srcLDInst')||at(er,'ldInst'))===at(ld,'inst');
    else if(ds&&(!at(er,'serviceType')||at(er,'serviceType')===(type==='SV'?'SMV':'GOOSE')))hit=kids(ds,'FCDA').some(f=>at(f,'ldInst')===at(er,'ldInst')&&at(f,'lnClass')===at(er,'lnClass')&&at(f,'lnInst')===at(er,'lnInst')&&at(f,'doName')===at(er,'doName'));
    if(hit)s.set(at(sub,'name'),(s.get(at(sub,'name'))||0)+1)}}
  for(const n of all(cb,'IEDName')){const k=n.textContent.trim();if(!s.has(k))s.set(k,0)}return s}

function voltage(vl){const v=kid(vl,'Voltage');return v?v.textContent.trim()+' '+at(v,'multiplier')+at(v,'unit'):''}
function sym(t,x,y){switch(t){
  case'CBR':return`<rect class="sym" x="${x-10}" y="${y+4}" width="20" height="28" rx="1"/>`;
  case'DIS':return`<line class="wire" x1="${x}" y1="${y}" x2="${x}" y2="${y+8}"/><line class="wire" x1="${x}" y1="${y+28}" x2="${x+11}" y2="${y+9}"/><line class="wire" x1="${x-6}" y1="${y+8}" x2="${x+6}" y2="${y+8}"/><line class="wire" x1="${x}" y1="${y+28}" x2="${x}" y2="${y+36}"/>`;
  case'CTR':return`<line class="wire" x1="${x}" y1="${y}" x2="${x}" y2="${y+36}"/><circle class="sym" cx="${x}" cy="${y+18}" r="9" style="fill:none"/>`;
  case'VTR':return`<line class="wire" x1="${x}" y1="${y}" x2="${x}" y2="${y+6}"/><circle class="sym" cx="${x}" cy="${y+14}" r="8"/><circle class="sym" cx="${x}" cy="${y+25}" r="8" style="fill:none"/>`;
  default:return`<line class="wire" x1="${x}" y1="${y}" x2="${x}" y2="${y+36}"/><rect class="sym" x="${x-12}" y="${y+8}" width="24" height="20" rx="3"/><text x="${x}" y="${y+21.5}" text-anchor="middle" class="et">${esc(t)}</text>`}}
function sld(vl){const bays=kids(vl,'Bay');const maxE=Math.max(1,...bays.map(b=>kids(b,'ConductingEquipment').length));const W=Math.max(1,bays.length)*160+40,H=60+maxE*58+70;
  let s=`<svg class="sld" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Single line diagram ${esc(at(vl,'name'))}"><line class="bus" x1="20" y1="40" x2="${W-20}" y2="40"/><text class="sl" x="20" y="26">${esc(at(vl,'name'))} · ${esc(voltage(vl))}</text>`;
  bays.forEach((b,i)=>{const x=90+i*160;let y=40;s+=`<circle class="node" cx="${x}" cy="40" r="4"/>`;
    for(const e of kids(b,'ConductingEquipment')){const t=at(e,'type'),lns=kids(e,'LNode');s+=`<line class="wire" x1="${x}" y1="${y}" x2="${x}" y2="${y+20}"/>`;y+=20;
      s+=`<g class="eq" data-act="goto" data-path="${pathOf(e)}"><rect class="hit" x="${x-16}" y="${y}" width="120" height="38"/>${sym(t,x,y)}<text class="el" x="${x+20}" y="${y+16}">${esc(at(e,'name'))}</text><text class="et" x="${x+20}" y="${y+28}">${esc(t)}</text>`;
      if(lns.length)s+=`<text class="lnt" x="${x+50}" y="${y+28}">${esc(lns.map(l=>at(l,'lnClass')+at(l,'lnInst')).join(' '))}</text>`;s+=`</g>`;y+=36}
    s+=`<line class="wire" x1="${x}" y1="${y}" x2="${x}" y2="${y+16}"/><path class="wire" d="M${x-6} ${y+10} L${x} ${y+18} L${x+6} ${y+10}"/>`;
    s+=`<g class="eq" data-act="goto" data-path="${pathOf(b)}"><text class="bl" x="${x}" y="${H-30}" text-anchor="middle">${esc(at(b,'name'))}</text><text class="bd" x="${x}" y="${H-16}" text-anchor="middle">${esc(trunc(at(b,'desc'),24))}</text></g>`});
  return s+'</svg>'}

function doModel(ln,I){const T=I.LNodeType.get(at(ln,'lnType'));if(!T)return[];const out=[];
  for(const D of kids(T,'DO')){const rows=[];const DT=I.DOType.get(at(D,'type'));walkDO(DT,[at(D,'name')],0,rows);out.push({D,DT,rows})}
  function walkDO(DT,dp,dep,rows){if(!DT||dep>10)return;for(const c of kids(DT)){if(c.localName==='SDO'){const st=I.DOType.get(at(c,'type'));rows.push({sdo:true,name:at(c,'name'),dep,cdc:st?at(st,'cdc'):'?',dp:[...dp,at(c,'name')]});walkDO(st,[...dp,at(c,'name')],dep+1,rows)}else if(c.localName==='DA')walkDA(c,dp,[at(c,'name')],dep,at(c,'fc'),rows)}}
  function walkDA(e,dp,ap,dep,fc,rows){const bt=at(e,'bType');rows.push({name:at(e,'name'),dp,ap,dep,fc,bt,type:at(e,'type'),val:instVal(ln,dp,ap,e)});if(bt==='Struct'&&dep<12){const DT=I.DAType.get(at(e,'type'));if(DT)for(const b of kids(DT,'BDA'))walkDA(b,dp,[...ap,at(b,'name')],dep+1,fc,rows)}}
  return out}
function instVal(ln,dp,ap,e){let n=kids(ln,'DOI').find(d=>at(d,'name')===dp[0]);for(const s of [...dp.slice(1),...ap.slice(0,-1)]){if(!n)break;n=kids(n,'SDI').find(d=>at(d,'name')===s)}const dai=n&&kids(n,'DAI').find(d=>at(d,'name')===ap[ap.length-1]);const v=dai?kid(dai,'Val'):kid(e,'Val');return v?{v:v.textContent.trim(),inst:!!dai}:null}

 'DataSet:name':{w:'Name of the data set inside its logical node.',a:'Control blocks refer to the data set by this name (SCL Studio updates them). The data set reference is also sent in GOOSE frames and reports, so receivers configured with the old name reject messages until they are reloaded.',ty:'DS_TRIP, StatUrgA'},
 'IED:name':{w:'Unique name of the IED in the SCD. It starts every object reference, e.g. P132_Q01PROT/PTRC1.Tr.general.',a:'Editing it here changes only the IED element. Use Rename in the IEDs view instead, which also updates access points, inputs, report clients, LNode bindings and GoIDs.',ty:'Bay + function, e.g. P132_Q01'},

 'TrgOps:dupd':{w:'Send a report when a value is refreshed, even if it is the same.',a:'Needed for counters and frozen values. On ordinary signals it can multiply traffic, so leave it off unless the function needs it.'},
 'TrgOps:period':{w:'Send the whole data set every integrity period (intgPd).',a:'Gives the client regular snapshots, useful for measurements and as a heartbeat. Needs intgPd above 0 and adds a steady load.'},

 'OptFields:seqNum':{w:'Adds a sequence number to each report.',a:'Lets the client detect lost or repeated reports. Without it, gaps go unnoticed.'},

 'SmvOpts:refreshTime':{w:'Adds the refresh time to each SV message.',a:'Larger frames; only needed if subscribers use it.'},
 'SmvOpts:sampleSynchronized':{w:'Adds the synchronised flag (Edition 1).',a:'Subscribers use it to check that the merging unit is time synchronised.'},
 'SmvOpts:sampleRate':{w:'Adds the sample rate to each message.',a:'Lets subscribers verify the rate; slightly larger frames.'},
 'SmvOpts:dataSet':{w:'Adds the data set reference.',a:'Lets subscribers verify the content; larger frames.'},
 'SmvOpts:security':{w:'IEC 62351 security on the stream.',a:'Every subscriber must support and be configured for the same security.'},
 logName:{w:'Name of the IED log the entries are written to.',a:'Clients read the log by this name.'},

 'addr:MAC-Address':{w:'Destination multicast MAC address of the stream.',a:'Switches and subscribers filter on it. A duplicate makes subscribers accept the wrong stream; an address outside the IEC range may be blocked by switch multicast filters.',ty:'GOOSE 01-0C-CD-01-00-00 … 01-FF, SV 01-0C-CD-04-…'},

 'addr:VLAN-ID':{w:'IEEE 802.1Q VLAN of the stream (3 hex digits).',a:'Ethernet switches forward the frames only on ports configured for this VLAN. If the VLAN is not set up in the switches, subscribers never receive the stream.',ty:'000 (priority tag only) or the station GOOSE VLAN'},

 'addr:IP-SUBNET':{w:'Subnet mask of the access point.',a:'Defines which addresses are local. A wrong mask stops the IED reaching clients on its own LAN.',ty:'255.255.255.0'},
 'addr:IP-GATEWAY':{w:'Default router.',a:'Only used for traffic to other subnets (remote access, time servers elsewhere). A wrong gateway breaks only that traffic.'},
 'addr:OSI-AP-Title':{w:'OSI application process title used by MMS.',a:'The MMS client must use the same value; otherwise TCP connects but the association is refused ("ping works, no data").',ty:'1,3,9999,23'},
 'addr:OSI-AE-Qualifier':{w:'OSI application entity qualifier.',a:'Must match the client configuration, as for the AP title.',ty:'23'},
 'addr:OSI-PSEL':{w:'OSI presentation selector.',a:'Must match the client configuration, otherwise the MMS association fails.',ty:'00000001'},
 'addr:OSI-SSEL':{w:'OSI session selector.',a:'Must match the client configuration.',ty:'0001'},

 lnType:{w:'Data type (LNodeType) that defines which data objects this logical node has.',a:'Switching types changes the available data objects. Data sets, inputs and client mappings that refer to objects missing in the new type become invalid.'},

  ${subs.length*pubs.length>2500?`<div class="card"><h2 style="margin-bottom:4px">Subscriptions by publisher</h2><p class="muted" style="margin:0 0 8px">${pubs.length} publishers × ${subs.length} subscribers is too large for a matrix, so links are listed per publisher. Use the filter below to narrow down.</p><div class="tbl"><table><tr><th>Publisher</th><th>GOOSE to</th><th>SV to</th><th>Reports to</th></tr>${pubs.filter(p=>!fq||p.toLowerCase().includes(fq)).slice(0,S.flim).map(p=>{const g={G:[],S:[],R:[]};for(const s of subs){const v=mx[p+'>'+s];if(v){if(v.G)g.G.push(s);if(v.S)g.S.push(s);if(v.R)g.R.push(s)}}return`<tr><td class="mono"><b>${esc(p)}</b></td>${['G','S','R'].map(k=>`<td class="mono" style="font-size:11.5px">${g[k].map(esc).join(', ')||'<span class="muted">—</span>'}</td>`).join('')}</tr>`}).join('')}</table></div></div>`:`<div class="card"><h2 style="margin-bottom:8px">Subscription matrix</h2><div class="tbl"><table class="mx"><tr><th class="h">Publisher ↓ / Subscriber →</th>${subs.map(s=>`<th class="mono">${esc(s)}</th>`).join('')}</tr>${pubs.map(p=>`<tr><td class="h mono"><b>${esc(p)}</b></td>${subs.map(s=>{const v=mx[p+'>'+s];return`<td>${v?`<span class="cellv">${[v.G?v.G+'G':'',v.S?v.S+'S':'',v.R?v.R+'R':''].filter(Boolean).join(' ')}</span>`:(p===s?'<span class="muted">·</span>':'')}</td>`}).join('')}</tr>`).join('')||'<tr><td class="muted">No control blocks found.</td></tr>'}</table></div></div>`}
  <div class="card"><div class="vh" style="margin-bottom:8px"><h2>Control blocks <span class="muted mono" style="font-size:12px">${fl.length}</span></h2><input class="f" id="fq" data-inp="fq" placeholder="Filter by IED, block, data set or type" value="${esc(S.fq)}" style="width:min(320px,100%)"></div><div class="tbl"><table><tr><th>Type</th><th>IED</th><th>Path</th><th>Data set</th><th class="num">Members</th><th>ID</th><th>confRev</th><th>Address</th><th>Subscribers</th></tr>
  ${fl.slice(0,S.flim).map(c=>{const A=c.addr&&kid(c.addr,'Address');const id=at(c.cb,'appID')||at(c.cb,'smvID')||at(c.cb,'rptID')||at(c.cb,'logName');const p=pathOf(c.cb);
   return`<tr class="click${S.flowSel===p?' on':''}" data-act="flowsel" data-path="${p}"><td><span class="chip ${c.type==='GOOSE'?'acc':c.type==='SV'?'info':''}">${c.type}</span></td><td class="mono">${esc(at(c.ied,'name'))}</td><td class="mono">${esc(at(c.ld,'inst'))}/${esc(lnName(c.ln))}.${esc(at(c.cb,'name'))}</td><td class="mono">${esc(at(c.cb,'datSet'))||'<span class="muted">—</span>'}</td><td class="num">${c.ds?kids(c.ds,'FCDA').length:0}</td><td class="mono" style="font-size:11px">${esc(trunc(id,38))}</td><td class="mono">${esc(at(c.cb,'confRev'))}</td>
    <td class="mono" style="font-size:11px">${A?esc(pval(A,'MAC-Address'))+'<br>APPID '+esc(pval(A,'APPID'))+' VLAN '+esc(pval(A,'VLAN-ID')):(c.type==='GOOSE'||c.type==='SV'?'<span class="bad">none</span>':'')}${c.type.endsWith('RCB')?`max ${esc(at(kid(c.cb,'RptEnabled'),'max')||'1')}${at(c.cb,'intgPd')?' · intg '+esc(at(c.cb,'intgPd'))+' ms':''}`:''}</td>
